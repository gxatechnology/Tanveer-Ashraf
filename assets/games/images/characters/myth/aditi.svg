<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAditi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c46"/>
      <stop offset="60%" stop-color="#163857"/>
      <stop offset="100%" stop-color="#0a1a2b"/>
    </linearGradient>
    <linearGradient id="skinAditi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c48e68"/>
      <stop offset="100%" stop-color="#a8714b"/>
    </linearGradient>
    <linearGradient id="suitNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b3857"/>
      <stop offset="50%" stop-color="#142c46"/>
      <stop offset="100%" stop-color="#0f2135"/>
    </linearGradient>
    <linearGradient id="goldDetail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfbf80"/>
      <stop offset="50%" stop-color="#f5e1b5"/>
      <stop offset="100%" stop-color="#b98a38"/>
    </linearGradient>
  </defs>

  <!-- Background Aura & Frame -->
  <rect width="240" height="280" rx="14" fill="url(#bgAditi)"/>
  <circle cx="120" cy="115" r="85" fill="#1b385722" stroke="#dfbf8033" stroke-width="1.5"/>

  <!-- Shoulders & Formal Navy Academic Blazer -->
  <path d="M42 280c0-65 26-95 78-95s78 30 78 95z" fill="url(#suitNavy)"/>

  <!-- Crisp White Collared Shirt -->
  <polygon points="120,192 104,152 136,152" fill="#f8fafc"/>
  <polygon points="120,192 108,172 120,165 132,172" fill="#e2e8f0"/>

  <!-- Blazer Lapels -->
  <path d="M78 185l26-33 16 40-20 88z" fill="#16304d"/>
  <path d="M162 185l-26-33-16 40 20 88z" fill="#16304d"/>
  <!-- Gold Lapel Pin of Scales of Justice -->
  <circle cx="86" cy="205" r="5" fill="url(#goldDetail)"/>
  <polygon points="86,202 83,207 89,207" fill="#142c46"/>

  <!-- Neck -->
  <rect x="108" y="130" width="24" height="30" fill="url(#skinAditi)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="112" rx="38" ry="45" fill="url(#skinAditi)"/>

  <!-- Hair - Neatly Styled Modern Professional Cut -->
  <path d="M78 112c-2-45 22-60 42-60 25 0 42 15 42 60-10-12-22-18-42-18s-32 6-42 18z" fill="#1a1c22"/>
  <path d="M76 112c-4 18-2 38 6 48 3-15 4-30 4-42-4-2-7-4-10-6z" fill="#1a1c22"/>
  <path d="M164 112c4 18 2 38-6 48-3-15-4-30-4-42 4-2 7-4 10-6z" fill="#1a1c22"/>

  <!-- Eyes, Eyebrows & Intelligent Expression -->
  <path d="M96 97c6-3 14-3 18 0" stroke="#1a1c22" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M126 97c4-3 12-3 18 0" stroke="#1a1c22" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  
  <ellipse cx="105" cy="106" rx="4.5" ry="3.5" fill="#1a1c22"/>
  <circle cx="106.5" cy="105" r="1.2" fill="#ffffff"/>
  <ellipse cx="135" cy="106" rx="4.5" ry="3.5" fill="#1a1c22"/>
  <circle cx="136.5" cy="105" r="1.2" fill="#ffffff"/>

  <!-- Subtle Rimless/Gold Wire Eyeglasses -->
  <rect x="94" y="99" width="22" height="15" rx="3" fill="none" stroke="url(#goldDetail)" stroke-width="1.6"/>
  <rect x="124" y="99" width="22" height="15" rx="3" fill="none" stroke="url(#goldDetail)" stroke-width="1.6"/>
  <line x1="116" y1="106" x2="124" y2="106" stroke="url(#goldDetail)" stroke-width="1.6"/>
  <line x1="94" y1="105" x2="84" y2="102" stroke="url(#goldDetail)" stroke-width="1.2"/>
  <line x1="146" y1="105" x2="156" y2="102" stroke="url(#goldDetail)" stroke-width="1.2"/>

  <!-- Nose & Smile -->
  <path d="M119 108v14l6 2" stroke="#875333" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M110 134c6 4 14 4 20 0" stroke="#8c3d47" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Gold Earring Studs -->
  <circle cx="80" cy="122" r="3" fill="url(#goldDetail)"/>
  <circle cx="160" cy="122" r="3" fill="url(#goldDetail)"/>

  <!-- Name Plaque Ribbon -->
  <rect x="25" y="246" width="190" height="26" rx="6" fill="#0d1f30" stroke="#dfbf80" stroke-width="1.2"/>
  <text x="120" y="263" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#dfbf80" text-anchor="middle" letter-spacing="0.5">Prof. Aditi Menon</text>
</svg>
