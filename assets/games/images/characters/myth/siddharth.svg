<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSiddharth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c46"/>
      <stop offset="60%" stop-color="#122538"/>
      <stop offset="100%" stop-color="#091420"/>
    </linearGradient>
    <linearGradient id="skinSiddharth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#be875e"/>
      <stop offset="100%" stop-color="#9e6943"/>
    </linearGradient>
    <linearGradient id="suitCharcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242b35"/>
      <stop offset="50%" stop-color="#1a2028"/>
      <stop offset="100%" stop-color="#10141a"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfbf80"/>
      <stop offset="50%" stop-color="#f5e1b5"/>
      <stop offset="100%" stop-color="#b98a38"/>
    </linearGradient>
  </defs>

  <!-- Background Aura & Frame -->
  <rect width="240" height="280" rx="14" fill="url(#bgSiddharth)"/>
  <circle cx="120" cy="115" r="85" fill="#242b3522" stroke="#dfbf8033" stroke-width="1.5"/>

  <!-- Shoulders & Dark Formal Charcoal Suit -->
  <path d="M38 280c0-68 28-98 82-98s82 30 82 98z" fill="url(#suitCharcoal)"/>

  <!-- Crisp White Shirt & Silk Navy Tie -->
  <polygon points="120,195 106,148 134,148" fill="#f8fafc"/>
  <polygon points="120,158 116,150 124,150" fill="#142c46"/>
  <polygon points="120,158 114,230 120,240 126,230" fill="#142c46"/>
  <!-- Gold Tie Bar Pin -->
  <line x1="114" y1="185" x2="126" y2="185" stroke="url(#goldAcc)" stroke-width="2"/>

  <!-- Antique Gold Pocket Square -->
  <polygon points="68,235 76,220 84,235" fill="url(#goldAcc)"/>
  <line x1="64" y1="235" x2="88" y2="235" stroke="#10141a" stroke-width="2"/>

  <!-- Suit Lapels -->
  <path d="M72 186l32-38 16 48-24 84z" fill="#161b22"/>
  <path d="M168 186l-32-38-16 48 24 84z" fill="#161b22"/>

  <!-- Neck -->
  <rect x="108" y="128" width="24" height="28" fill="url(#skinSiddharth)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="110" rx="38" ry="44" fill="url(#skinSiddharth)"/>

  <!-- Salt & Pepper Hair -->
  <path d="M80 108c-2-42 22-58 40-58 24 0 40 16 40 58-12-10-22-14-40-14s-28 4-40 14z" fill="#262b33"/>
  <!-- Silver Highlights on Temples -->
  <path d="M80 108c0-25 12-42 28-48-8 12-14 28-14 44z" fill="#8c95a0" opacity="0.75"/>
  <path d="M160 108c0-25-12-42-28-48 8 12 14 28 14 44z" fill="#8c95a0" opacity="0.75"/>

  <!-- Eyebrows & Observant Eyes -->
  <path d="M96 95c6-3 14-3 18 0" stroke="#262b33" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M126 95c4-3 12-3 18 0" stroke="#262b33" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <ellipse cx="105" cy="104" rx="4.5" ry="3.5" fill="#1a1c20"/>
  <circle cx="106.5" cy="103" r="1.2" fill="#ffffff"/>
  <ellipse cx="135" cy="104" rx="4.5" ry="3.5" fill="#1a1c20"/>
  <circle cx="136.5" cy="103" r="1.2" fill="#ffffff"/>

  <!-- Characterful Nose -->
  <path d="M119 105v15l6 2" stroke="#784828" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Salt & Pepper Groomed Beard and Mustache -->
  <path d="M102 124c10-2 26-2 36 0-4 12-10 18-18 18s-14-6-18-18z" fill="#2b313a"/>
  <!-- Chin Beard -->
  <path d="M96 122c4 26 14 36 24 36s20-10 24-36c-8 6-16 8-24 8s-16-2-24-8z" fill="#242830"/>
  <!-- Silver Specks on Beard -->
  <path d="M104 135c4 10 10 16 16 16s12-6 16-16c-6 4-12 6-16 6s-10-2-16-6z" fill="#9ca3af" opacity="0.6"/>

  <!-- Gold Lapel Emblem (Law Journal Quill) -->
  <polygon points="80,205 78,212 82,212" fill="url(#goldAcc)"/>
  <circle cx="80" cy="203" r="2.5" fill="url(#goldAcc)"/>

  <!-- Name Plaque Ribbon -->
  <rect x="22" y="246" width="196" height="26" rx="6" fill="#091420" stroke="#dfbf80" stroke-width="1.2"/>
  <text x="120" y="263" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#dfbf80" text-anchor="middle" letter-spacing="0.5">Adv. Siddharth Kapoor</text>
</svg>
