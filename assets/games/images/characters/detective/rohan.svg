<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRohan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2e3d"/>
      <stop offset="100%" stop-color="#0c1720"/>
    </linearGradient>
    <linearGradient id="skinRohan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c18e63"/>
      <stop offset="100%" stop-color="#a47248"/>
    </linearGradient>
    <linearGradient id="jacketRohan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24384a"/>
      <stop offset="100%" stop-color="#14222f"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="14" fill="url(#bgRohan)"/>
  <circle cx="120" cy="115" r="85" fill="#dfbf800f" stroke="#dfbf8022" stroke-width="1.5"/>

  <!-- Body / Field Jacket -->
  <path d="M42 280c0-58 26-88 78-88s78 30 78 88z" fill="url(#jacketRohan)"/>
  <!-- Field collar with zipped inner -->
  <path d="M100 192l20 22 20-22v40h-40z" fill="#0f1922"/>
  <rect x="119" y="192" width="2" height="40" fill="#dfbf80"/>
  <!-- Shoulder epaulets -->
  <rect x="52" y="200" width="30" height="8" rx="2" fill="#1b2a38" stroke="#dfbf8044" stroke-width="1"/>
  <rect x="158" y="200" width="30" height="8" rx="2" fill="#1b2a38" stroke="#dfbf8044" stroke-width="1"/>

  <!-- Neck -->
  <rect x="107" y="136" width="26" height="26" fill="url(#skinRohan)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="114" rx="39" ry="44" fill="url(#skinRohan)"/>

  <!-- Short Modern Hair -->
  <path d="M81 106c0-36 16-52 39-52s39 16 39 52c-8-6-20-10-39-10s-31 4-39 10z" fill="#1b1d20"/>
  <path d="M80 94l6-14 12 4-4 12z" fill="#1b1d20"/>

  <!-- Ears -->
  <ellipse cx="79" cy="116" rx="6" ry="10" fill="url(#skinRohan)"/>
  <ellipse cx="161" cy="116" rx="6" ry="10" fill="url(#skinRohan)"/>

  <!-- Facial Features -->
  <!-- Eyebrows (Alert, Energetic) -->
  <path d="M92 98c7-4 15-3 20 0" stroke="#1b1d20" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M148 98c-7-4-15-3-20 0" stroke="#1b1d20" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Direct, Sharp) -->
  <ellipse cx="103" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="103" cy="106" r="3" fill="#1f1812"/>
  <circle cx="104" cy="105" r="1" fill="#ffffff"/>
  <ellipse cx="137" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="137" cy="106" r="3" fill="#1f1812"/>
  <circle cx="138" cy="105" r="1" fill="#ffffff"/>

  <!-- Nose & Mouth -->
  <path d="M120 106v14l4 2" stroke="#875836" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M111 134c6 1 12 1 18 0" stroke="#774726" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badge Label -->
  <rect x="25" y="240" width="190" height="28" rx="6" fill="#12202df0" stroke="#dfbf8055" stroke-width="1"/>
  <text x="120" y="258" fill="#e7c88c" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">OFFICER ROHAN VERMA</text>
</svg>
