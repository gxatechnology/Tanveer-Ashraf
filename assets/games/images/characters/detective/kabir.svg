<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKabir" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122538"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="skinKabir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b8865c"/>
      <stop offset="100%" stop-color="#9a6b44"/>
    </linearGradient>
    <linearGradient id="suitKabir" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172e45"/>
      <stop offset="100%" stop-color="#0e1d2c"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="14" fill="url(#bgKabir)"/>
  <circle cx="120" cy="115" r="85" fill="#dfbf800f" stroke="#dfbf8022" stroke-width="1.5"/>

  <!-- Body / Navy Formal Suit -->
  <path d="M42 280c0-60 25-90 78-90s78 30 78 90z" fill="url(#suitKabir)"/>
  <!-- White shirt & dark tie -->
  <polygon points="120,185 104,148 136,148" fill="#f4f5f8"/>
  <polygon points="120,185 117,235 123,235" fill="#137d72"/>
  <path d="M88 190l24 60h16l-12-60z" fill="#0d1b28"/>
  <path d="M152 190l-24 60h-16l12-60z" fill="#0d1b28"/>

  <!-- Neck -->
  <rect x="108" y="134" width="24" height="28" fill="url(#skinKabir)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="114" rx="40" ry="46" fill="url(#skinKabir)"/>

  <!-- Hair (Neat Side Parting) -->
  <path d="M80 108c0-36 18-52 40-52s40 16 40 52c-10-8-22-12-40-12s-30 4-40 12z" fill="#1a1c20"/>

  <!-- Ears -->
  <ellipse cx="78" cy="116" rx="6" ry="10" fill="url(#skinKabir)"/>
  <ellipse cx="162" cy="116" rx="6" ry="10" fill="url(#skinKabir)"/>

  <!-- Eyeglasses (Gold Rimmed, Scholarly) -->
  <!-- Left Rim -->
  <rect x="94" y="103" width="20" height="15" rx="3" fill="none" stroke="#dfbf80" stroke-width="2"/>
  <!-- Right Rim -->
  <rect x="126" y="103" width="20" height="15" rx="3" fill="none" stroke="#dfbf80" stroke-width="2"/>
  <!-- Bridge & Sides -->
  <path d="M114 109h12M94 108H78M146 108h16" stroke="#dfbf80" stroke-width="1.8"/>

  <!-- Eyes behind glasses -->
  <circle cx="104" cy="110" r="3" fill="#1f1812"/>
  <circle cx="136" cy="110" r="3" fill="#1f1812"/>

  <!-- Eyebrows -->
  <path d="M93 97c6-3 14-2 18 1" stroke="#1a1c20" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M147 97c-6-3-14-2-18 1" stroke="#1a1c20" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Nose & Mouth -->
  <path d="M120 114v12l4 2" stroke="#7e5433" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M112 136c5 2 11 2 16 0" stroke="#6e4225" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badge Label -->
  <rect x="25" y="240" width="190" height="28" rx="6" fill="#0d1f30f0" stroke="#dfbf8055" stroke-width="1"/>
  <text x="120" y="258" fill="#e7c88c" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">ADV. KABIR MEHTA</text>
</svg>
