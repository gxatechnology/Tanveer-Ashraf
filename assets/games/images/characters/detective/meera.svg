<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMeera" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f262f"/>
      <stop offset="100%" stop-color="#0a171d"/>
    </linearGradient>
    <linearGradient id="skinMeera" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c59169"/>
      <stop offset="100%" stop-color="#aa7650"/>
    </linearGradient>
    <linearGradient id="coatMeera" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#137d72"/>
      <stop offset="100%" stop-color="#0c4f48"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="14" fill="url(#bgMeera)"/>
  <circle cx="120" cy="115" r="85" fill="#137d7211" stroke="#2fe0c833" stroke-width="1.5"/>

  <!-- Body / Dark Teal Blazer -->
  <path d="M44 280c0-55 24-85 76-85s76 30 76 85z" fill="url(#coatMeera)"/>
  <!-- Crisp formal inner blouse -->
  <polygon points="120,185 106,145 134,145" fill="#f4f5f8"/>
  <path d="M90 195l20 50h20l-10-50z" fill="#0b4640"/>
  <path d="M150 195l-20 50h-20l10-50z" fill="#0b4640"/>

  <!-- Neck -->
  <rect x="108" y="132" width="24" height="28" fill="url(#skinMeera)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="112" rx="38" ry="44" fill="url(#skinMeera)"/>

  <!-- Tied Back Dark Hair -->
  <path d="M82 108c0-36 16-52 38-52s38 16 38 52c-8-8-20-10-38-10s-30 2-38 10z" fill="#19191c"/>
  <!-- Bun behind -->
  <circle cx="120" cy="58" r="14" fill="#19191c"/>
  <path d="M80 95c-2 15 2 24 6 28 0-10 4-18 8-22z" fill="#19191c"/>
  <path d="M160 95c2 15-2 24-6 28 0-10-4-18-8-22z" fill="#19191c"/>

  <!-- Ears & Pearls -->
  <ellipse cx="80" cy="116" rx="6" ry="10" fill="url(#skinMeera)"/>
  <ellipse cx="160" cy="116" rx="6" ry="10" fill="url(#skinMeera)"/>
  <circle cx="80" cy="122" r="3" fill="#f4f5f8"/>
  <circle cx="160" cy="122" r="3" fill="#f4f5f8"/>

  <!-- Facial Features -->
  <!-- Eyebrows (Smart, Precise) -->
  <path d="M94 98c6-3 14-2 18 1" stroke="#19191c" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M146 98c-6-3-14-2-18 1" stroke="#19191c" stroke-width="2.2" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Intelligent, Scientific) -->
  <ellipse cx="104" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="104" cy="106" r="3" fill="#2c2016"/>
  <circle cx="105" cy="105" r="1" fill="#ffffff"/>
  <ellipse cx="136" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="136" cy="106" r="3" fill="#2c2016"/>
  <circle cx="137" cy="105" r="1" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M120 106v14l4 2" stroke="#895b39" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Confident Smile -->
  <path d="M112 132c5 3 11 3 16 0" stroke="#7e4c2b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badge Label -->
  <rect x="25" y="240" width="190" height="28" rx="6" fill="#082229f0" stroke="#2fe0c855" stroke-width="1"/>
  <text x="120" y="258" fill="#a9dcd6" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">DR. MEERA SEN</text>
