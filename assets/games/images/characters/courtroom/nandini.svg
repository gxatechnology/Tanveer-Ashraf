<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgNandini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c3d"/>
      <stop offset="100%" stop-color="#08151f"/>
    </linearGradient>
    <linearGradient id="skinNandini" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c69268"/>
      <stop offset="100%" stop-color="#aa774e"/>
    </linearGradient>
    <linearGradient id="sariNandini" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#193b58"/>
      <stop offset="100%" stop-color="#0d2438"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="14" fill="url(#bgNandini)"/>
  <circle cx="120" cy="115" r="85" fill="#dfbf800f" stroke="#dfbf8022" stroke-width="1.5"/>

  <!-- Body / Formal Court Staff Attire -->
  <path d="M44 280c0-54 24-84 76-84s76 30 76 84z" fill="url(#sariNandini)"/>
  <!-- Formal Collared Inner Shirt -->
  <polygon points="120,185 106,145 134,145" fill="#f8fafc"/>
  <!-- Red file ribbon / badge -->
  <rect x="80" y="210" width="12" height="70" rx="2" fill="#a63b49"/>

  <!-- Legal File Folder Held in Hand -->
  <g transform="translate(130, 210) rotate(-10)">
    <rect x="0" y="0" width="65" height="70" rx="4" fill="#dfbf80" stroke="#9a7428" stroke-width="1.5"/>
    <rect x="6" y="8" width="53" height="12" fill="#fff8ee"/>
    <text x="32" y="17" fill="#755823" font-size="7" font-family="sans-serif" font-weight="bold" text-anchor="middle">CAUSE LIST</text>
  </g>

  <!-- Neck -->
  <rect x="108" y="132" width="24" height="26" fill="url(#skinNandini)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="112" rx="38" ry="44" fill="url(#skinNandini)"/>

  <!-- Professional Hairstyle (Tidy Parting & Bun) -->
  <path d="M82 106c0-36 16-52 38-52s38 16 38 52c-8-8-20-10-38-10s-30 2-38 10z" fill="#1b1c20"/>
  <circle cx="120" cy="56" r="13" fill="#1b1c20"/>

  <!-- Ears & Delicate Pearl Earrings -->
  <ellipse cx="80" cy="116" rx="6" ry="10" fill="url(#skinNandini)"/>
  <ellipse cx="160" cy="116" rx="6" ry="10" fill="url(#skinNandini)"/>
  <circle cx="80" cy="122" r="2.5" fill="#f4f5f8"/>
  <circle cx="160" cy="122" r="2.5" fill="#f4f5f8"/>

  <!-- Eyebrows (Approachable, Organized) -->
  <path d="M94 97c6-2 14-2 18 1" stroke="#1b1c20" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M146 97c-6-2-14-2-18 1" stroke="#1b1c20" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Clear, Professional) -->
  <ellipse cx="104" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="104" cy="106" r="3" fill="#241a12"/>
  <circle cx="105" cy="105" r="1" fill="#ffffff"/>
  <ellipse cx="136" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="136" cy="106" r="3" fill="#241a12"/>
  <circle cx="137" cy="105" r="1" fill="#ffffff"/>

  <!-- Nose & Friendly Smile -->
  <path d="M120 106v14l4 2" stroke="#875836" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M112 133c5 2 11 2 16 0" stroke="#774522" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badge Label -->
  <rect x="25" y="240" width="190" height="28" rx="6" fill="#0c1d2af0" stroke="#dfbf8055" stroke-width="1"/>
  <text x="120" y="258" fill="#e7c88c" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">NANDINI SHARMA</text>
</svg>
