<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVikram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192330"/>
      <stop offset="100%" stop-color="#0a1017"/>
    </linearGradient>
    <linearGradient id="skinVikram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b88358"/>
      <stop offset="100%" stop-color="#9a653c"/>
    </linearGradient>
    <linearGradient id="robeVikram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181c"/>
      <stop offset="100%" stop-color="#080a0c"/>
    </linearGradient>
  </defs>
  <rect width="240" height="280" rx="14" fill="url(#bgVikram)"/>
  <circle cx="120" cy="115" r="85" fill="#dfbf800f" stroke="#dfbf8044" stroke-width="1.5"/>

  <!-- Body / Judicial Robe -->
  <path d="M38 280c0-62 26-92 82-92s82 30 82 92z" fill="url(#robeVikram)"/>
  <!-- White Advocate/Judge Neck Bands -->
  <rect x="112" y="152" width="6" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <rect x="122" y="152" width="6" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.5"/>
  <polygon points="120,154 104,142 136,142" fill="#ffffff"/>
  <!-- Robe lapels & satin border -->
  <path d="M84 188l24 65h24l-16-65z" fill="#1c2228"/>
  <path d="M156 188l-24 65h-24l16-65z" fill="#1c2228"/>

  <!-- Neck -->
  <rect x="107" y="132" width="26" height="24" fill="url(#skinVikram)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="112" rx="41" ry="46" fill="url(#skinVikram)"/>

  <!-- Hair (Silver Streaked, Dignified) -->
  <path d="M78 106c0-38 18-54 42-54s42 16 42 54c-10-8-22-12-42-12s-32 4-42 12z" fill="#4a5568"/>
  <path d="M80 85c8-16 22-26 40-26s32 10 40 26c-10-6-24-10-40-10s-30 4-40 10z" fill="#cbd5e1"/>
  <path d="M78 100c-3 14 0 24 2 28 4-8 8-14 10-18z" fill="#cbd5e1"/>
  <path d="M162 100c3 14 0 24-2 28-4-8-8-14-10-18z" fill="#cbd5e1"/>

  <!-- Ears -->
  <ellipse cx="77" cy="116" rx="6" ry="11" fill="url(#skinVikram)"/>
  <ellipse cx="163" cy="116" rx="6" ry="11" fill="url(#skinVikram)"/>

  <!-- Character / Age Lines -->
  <path d="M100 88c8-3 14-3 20 0M124 88c8-3 14-3 20 0" stroke="#7a4a25" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M96 116c4 3 4 8 0 12M144 116c-4 3-4 8 0 12" stroke="#7a4a25" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows (Senior, Wise) -->
  <path d="M90 98c8-3 18-3 24 1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M150 98c-8-3-18-3-24 1" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Deep, Reflective) -->
  <ellipse cx="102" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="102" cy="106" r="3" fill="#1e1814"/>
  <circle cx="103" cy="105" r="1" fill="#ffffff"/>
  <ellipse cx="138" cy="106" rx="6" ry="4" fill="#ffffff"/>
  <circle cx="138" cy="106" r="3" fill="#1e1814"/>
  <circle cx="139" cy="105" r="1" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M118 106v15l5 2" stroke="#7a4a25" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Dignified Mouth -->
  <path d="M111 133c6 1 12 1 18 0" stroke="#68391b" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Badge Label -->
  <rect x="25" y="240" width="190" height="28" rx="6" fill="#0d141df0" stroke="#dfbf8066" stroke-width="1"/>
  <text x="120" y="258" fill="#e7c88c" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">JUSTICE VIKRAM SAHAY</text>
