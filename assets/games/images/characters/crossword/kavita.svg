<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKavita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c46"/>
      <stop offset="60%" stop-color="#113644"/>
      <stop offset="100%" stop-color="#0a1d2e"/>
    </linearGradient>
    <linearGradient id="skinKavita" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bd8760"/>
      <stop offset="100%" stop-color="#a26c47"/>
    </linearGradient>
    <linearGradient id="sareeTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176d63"/>
      <stop offset="50%" stop-color="#13534c"/>
      <stop offset="100%" stop-color="#0d3b36"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dfbf80"/>
      <stop offset="50%" stop-color="#f5e1b5"/>
      <stop offset="100%" stop-color="#b98a38"/>
    </linearGradient>
  </defs>

  <!-- Background Aura & Frame -->
  <rect width="240" height="280" rx="14" fill="url(#bgKavita)"/>
  <circle cx="120" cy="115" r="85" fill="#176d6314" stroke="#dfbf8033" stroke-width="1.5"/>

  <!-- Saree Blouse & Pallu -->
  <!-- Shoulders & Torso -->
  <path d="M40 280c0-62 26-92 80-92s80 30 80 92z" fill="#0d2b38"/>
  
  <!-- Saree Pallu flowing diagonally across left shoulder -->
  <path d="M52 280c5-55 25-88 65-100l30 18-50 82z" fill="url(#sareeTeal)"/>
  <!-- Gold Zari Border on Saree Pallu -->
  <path d="M50 280c4-54 23-86 63-98l4 6c-38 12-57 42-61 92z" fill="url(#goldBorder)"/>
  
  <!-- Right Shoulder Drape -->
  <path d="M142 195c25 15 42 45 46 85h-45c-2-35-15-60-25-72z" fill="url(#sareeTeal)"/>

  <!-- Neck -->
  <rect x="107" y="132" width="26" height="32" fill="url(#skinKavita)"/>
  <!-- Gold Pendant Necklace -->
  <path d="M106 156c7 10 21 10 28 0" stroke="#dfbf80" stroke-width="2" fill="none"/>
  <polygon points="120,165 116,159 124,159" fill="#dfbf80"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="115" rx="40" ry="46" fill="url(#skinKavita)"/>

  <!-- Hair - Styled Bun with Neat Side Parting -->
  <path d="M76 112c-2-42 20-58 44-58 26 0 44 16 44 58-12-10-24-15-44-15s-32 5-44 15z" fill="#1a1c20"/>
  <!-- Hair Bun behind head -->
  <ellipse cx="120" cy="58" rx="28" ry="16" fill="#15171a"/>
  <!-- Hair strands around cheekbones -->
  <path d="M78 102c-4 18-2 32 2 38 4-12 8-22 10-28z" fill="#1a1c20"/>
  <path d="M162 102c4 18 2 32-2 38-4-12-8-22-10-28z" fill="#1a1c20"/>

  <!-- Ears -->
  <ellipse cx="78" cy="118" rx="6" ry="10" fill="url(#skinKavita)"/>
  <ellipse cx="162" cy="118" rx="6" ry="10" fill="url(#skinKavita)"/>
  <!-- Gold Drop Earrings -->
  <circle cx="78" cy="128" r="3" fill="#dfbf80"/>
  <circle cx="162" cy="128" r="3" fill="#dfbf80"/>

  <!-- Eyebrows (Intellectual, Kind) -->
  <path d="M92 98c8-3 16-2 22 2" stroke="#1a1c20" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M148 98c-8-3-16-2-22 2" stroke="#1a1c20" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Red Bindi -->
  <circle cx="120" cy="98" r="2.5" fill="#a63b49"/>

  <!-- Eyes with scholarly warmth -->
  <!-- Left Eye -->
  <ellipse cx="103" cy="108" rx="8" ry="5.5" fill="#f8fafc"/>
  <ellipse cx="104" cy="108" rx="4.5" ry="4.5" fill="#2d1c12"/>
  <circle cx="106" cy="106.5" r="1.5" fill="#ffffff"/>
  <path d="M95 106c4-3 12-3 16 0" stroke="#1a1c20" stroke-width="1.8" fill="none"/>

  <!-- Right Eye -->
  <ellipse cx="137" cy="108" rx="8" ry="5.5" fill="#f8fafc"/>
  <ellipse cx="136" cy="108" rx="4.5" ry="4.5" fill="#2d1c12"/>
  <circle cx="138" cy="106.5" r="1.5" fill="#ffffff"/>
  <path d="M129 106c4-3 12-3 16 0" stroke="#1a1c20" stroke-width="1.8" fill="none"/>

  <!-- Academic Glasses (Elegant Gold Rimmed) -->
  <rect x="91" y="99" width="24" height="18" rx="6" fill="#dfbf8015" stroke="#dfbf80" stroke-width="2"/>
  <rect x="125" y="99" width="24" height="18" rx="6" fill="#dfbf8015" stroke="#dfbf80" stroke-width="2"/>
  <path d="M115 107h10" stroke="#dfbf80" stroke-width="2"/>
  <path d="M91 106l-13-2" stroke="#dfbf80" stroke-width="1.5"/>
  <path d="M149 106l13-2" stroke="#dfbf80" stroke-width="1.5"/>

  <!-- Nose -->
  <path d="M120 108v16l4 2" stroke="#8c5836" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Lips (Warm, encouraging smile) -->
  <path d="M110 134c6 4 14 4 20 0" stroke="#a63b49" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M113 135c4 2 10 2 14 0" fill="#a63b491a"/>

  <!-- Name Badge Overlay -->
  <rect x="18" y="244" width="204" height="26" rx="6" fill="#142c46f2" stroke="#dfbf80" stroke-width="1"/>
  <text x="120" y="261" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80" text-anchor="middle" letter-spacing="0.5">Prof. Kavita Sharma</text>
</svg>