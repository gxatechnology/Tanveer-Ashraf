<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDevendra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142c46"/>
      <stop offset="60%" stop-color="#1e2230"/>
      <stop offset="100%" stop-color="#0a121d"/>
    </linearGradient>
    <linearGradient id="skinDevendra" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bc865c"/>
      <stop offset="100%" stop-color="#9a6540"/>
    </linearGradient>
    <linearGradient id="waistcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243447"/>
      <stop offset="50%" stop-color="#1a2736"/>
      <stop offset="100%" stop-color="#111a24"/>
    </linearGradient>
  </defs>

  <!-- Background Frame & Aura -->
  <rect width="240" height="280" rx="14" fill="url(#bgDevendra)"/>
  <circle cx="120" cy="115" r="85" fill="#dfbf800f" stroke="#dfbf8033" stroke-width="1.5"/>

  <!-- Torso & Clothing -->
  <!-- Tweed Coat Shoulders -->
  <path d="M40 280c0-60 25-90 80-90s80 30 80 90z" fill="#18222d"/>

  <!-- Cream Formal Shirt Collar -->
  <polygon points="120,185 98,145 142,145" fill="#f4ede1"/>
  <!-- Maroon Tie -->
  <polygon points="120,188 115,245 120,250 125,245" fill="#7a2a35"/>

  <!-- Formal Waistcoat -->
  <path d="M86 195l28 55h12l-14-55z" fill="url(#waistcoat)"/>
  <path d="M154 195l-28 55h-12l14-55z" fill="url(#waistcoat)"/>
  <!-- Waistcoat Brass Buttons -->
  <circle cx="120" cy="205" r="2.5" fill="#dfbf80"/>
  <circle cx="120" cy="218" r="2.5" fill="#dfbf80"/>
  <circle cx="120" cy="231" r="2.5" fill="#dfbf80"/>
  <!-- Pocket Watch Gold Chain -->
  <path d="M102 225c8 10 16 10 22 2" stroke="#dfbf80" stroke-width="1.5" fill="none"/>

  <!-- Neck -->
  <rect x="106" y="132" width="28" height="32" fill="url(#skinDevendra)"/>

  <!-- Head Base -->
  <ellipse cx="120" cy="115" rx="41" ry="47" fill="url(#skinDevendra)"/>

  <!-- Grey / Silver Hair (Scholarly, neatly combed sides and receding forehead) -->
  <path d="M78 115c0-42 18-56 42-56s42 14 42 56c-10-10-22-14-42-14s-32 4-42 14z" fill="#9ca3af"/>
  <!-- Silver-grey highlights -->
  <path d="M84 92c8-14 20-22 36-22s28 8 36 22c-8-6-18-10-36-10s-28 4-36 10z" fill="#d1d5db"/>
  <!-- Sideburns -->
  <path d="M77 105c-3 15-2 25-1 30 5-10 10-15 12-18z" fill="#9ca3af"/>
  <path d="M163 105c3 15 2 25 1 30-5-10-10-15-12-18z" fill="#9ca3af"/>

  <!-- Ears -->
  <ellipse cx="76" cy="118" rx="7" ry="11" fill="url(#skinDevendra)"/>
  <ellipse cx="164" cy="118" rx="7" ry="11" fill="url(#skinDevendra)"/>

  <!-- Forehead Wisdom Lines -->
  <path d="M100 82c12-3 28-3 40 0" stroke="#875333" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  <path d="M104 88c10-2 22-2 32 0" stroke="#875333" stroke-width="1.2" stroke-linecap="round" fill="none"/>

  <!-- Eyebrows (Bushy Grey, Thoughtful) -->
  <path d="M92 98c8-4 18-4 24 0" stroke="#6b7280" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M148 98c-8-4-18-4-24 0" stroke="#6b7280" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Deep-set, observant) -->
  <ellipse cx="104" cy="107" rx="7.5" ry="5" fill="#f8fafc"/>
  <ellipse cx="104" cy="107" rx="4" ry="4" fill="#2d1d14"/>
  <circle cx="106" cy="105.5" r="1.2" fill="#ffffff"/>
  <path d="M96 105c4-3 12-3 16 0" stroke="#1f2937" stroke-width="1.5" fill="none"/>
  <!-- Eye bags / character lines -->
  <path d="M98 114c4 2 8 2 12 0" stroke="#875333" stroke-width="1" fill="none"/>

  <ellipse cx="136" cy="107" rx="7.5" ry="5" fill="#f8fafc"/>
  <ellipse cx="136" cy="107" rx="4" ry="4" fill="#2d1d14"/>
  <circle cx="138" cy="105.5" r="1.2" fill="#ffffff"/>
  <path d="M128 105c4-3 12-3 16 0" stroke="#1f2937" stroke-width="1.5" fill="none"/>
  <path d="M130 114c4 2 8 2 12 0" stroke="#875333" stroke-width="1" fill="none"/>

  <!-- Silver Wireframe Glasses -->
  <ellipse cx="104" cy="107" rx="14" ry="11" fill="#dfbf800f" stroke="#9ca3af" stroke-width="1.8"/>
  <ellipse cx="136" cy="107" rx="14" ry="11" fill="#dfbf800f" stroke="#9ca3af" stroke-width="1.8"/>
  <path d="M118 107h4" stroke="#9ca3af" stroke-width="2"/>
  <path d="M90 106l-13-2" stroke="#9ca3af" stroke-width="1.5"/>
  <path d="M150 106l13-2" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Nose (Prominent, refined) -->
  <path d="M120 107v17l5 3" stroke="#875333" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Neat Grey Mustache -->
  <path d="M106 132c8 4 14 1 14-2 0 3 6 6 14 2-4 5-10 6-14 3-4 3-10 2-14-3z" fill="#9ca3af"/>

  <!-- Mouth -->
  <path d="M112 138c4 2 12 2 16 0" stroke="#683d24" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Name Badge Overlay -->
  <rect x="18" y="244" width="204" height="26" rx="6" fill="#142c46f2" stroke="#dfbf80" stroke-width="1"/>
  <text x="120" y="261" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80" text-anchor="middle" letter-spacing="0.5">Dr. Devendra Bose</text>
</svg>