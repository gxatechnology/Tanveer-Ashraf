<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2d"/>
      <stop offset="100%" stop-color="#193b58"/>
    </linearGradient>
    <linearGradient id="pillarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="70%" stop-color="#dfbf80"/>
      <stop offset="100%" stop-color="#9a7428"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad8)"/>
  <!-- Grand Courthouse Pillars & Ascending Steps -->
  <g transform="translate(100, 30)">
    <!-- Pediment (Triangular roof) -->
    <polygon points="100,10 0,50 200,50" fill="#152f4a" stroke="url(#pillarGold)" stroke-width="2"/>
    <ellipse cx="100" cy="35" rx="14" ry="10" fill="#1b395a" stroke="#dfbf80" stroke-width="1.5"/>
    <path d="M96 35h8M100 31v8" stroke="#dfbf80" stroke-width="1.5"/>
    <!-- Architrave beam -->
    <rect x="5" y="50" width="190" height="12" fill="#1a3552" stroke="url(#pillarGold)" stroke-width="1"/>
    <!-- 4 Classical Pillars -->
    <g fill="#142c46" stroke="url(#pillarGold)" stroke-width="1.5">
      <!-- Pillar 1 -->
      <rect x="20" y="62" width="16" height="70" rx="2"/>
      <!-- Pillar 2 -->
      <rect x="68" y="62" width="16" height="70" rx="2"/>
      <!-- Pillar 3 -->
      <rect x="116" y="62" width="16" height="70" rx="2"/>
      <!-- Pillar 4 -->
      <rect x="164" y="62" width="16" height="70" rx="2"/>
    </g>
    <!-- Stepped Podium Steps (Ascending perspective) -->
    <polygon points="10,132 190,132 205,145 -5,145" fill="#1d3b5b" stroke="#dfbf8088" stroke-width="1"/>
    <polygon points="-5,145 205,145 220,160 -20,160" fill="#142c46" stroke="#dfbf80" stroke-width="1.5"/>
    <polygon points="-20,160 220,160 235,175 -35,175" fill="#0f2238" stroke="#dfbf80aa" stroke-width="2"/>
    <!-- Golden Scales above apex -->
    <circle cx="100" cy="8" r="5" fill="url(#pillarGold)"/>
  </g>
</svg>
