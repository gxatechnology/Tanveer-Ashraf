<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141f2e"/>
      <stop offset="100%" stop-color="#19334d"/>
    </linearGradient>
    <linearGradient id="gavelGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc5"/>
      <stop offset="70%" stop-color="#dfbf80"/>
      <stop offset="100%" stop-color="#8b651e"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad4)"/>
  <!-- Judicial Bench & Sound Block -->
  <g transform="translate(200, 140)">
    <!-- Round sound block -->
    <ellipse cx="0" cy="30" rx="65" ry="16" fill="#0f1f2e" stroke="#ffffff22" stroke-width="2"/>
    <ellipse cx="0" cy="24" rx="55" ry="12" fill="#172b3c" stroke="url(#gavelGold)" stroke-width="1.5"/>
    <!-- Sound block concentric ring -->
    <ellipse cx="0" cy="24" rx="35" ry="8" fill="none" stroke="#e7c88c44" stroke-width="1"/>
    <!-- Gavel (diagonal striking angle) -->
    <g transform="rotate(-32 0 0)">
      <!-- Handle -->
      <rect x="-6" y="-70" width="12" height="95" rx="6" fill="url(#gavelGold)" filter="drop-shadow(0 4px 10px rgba(0,0,0,0.5))"/>
      <rect x="-8" y="-76" width="16" height="12" rx="3" fill="#997025"/>
      <!-- Mallet Head -->
      <rect x="-35" y="-95" width="70" height="30" rx="6" fill="#1b3956" stroke="url(#gavelGold)" stroke-width="2.5"/>
      <rect x="-35" y="-90" width="10" height="20" rx="2" fill="url(#gavelGold)"/>
      <rect x="25" y="-90" width="10" height="20" rx="2" fill="url(#gavelGold)"/>
    </g>
    <!-- Gavel impact shockwaves -->
    <path d="M-45 10c-10-8-25-10-40-5M45 10c10-8 25-10 40-5" stroke="#e7c88c66" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>
</svg>
