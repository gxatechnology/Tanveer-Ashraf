<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e32"/>
      <stop offset="100%" stop-color="#14344b"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2"/>
      <stop offset="60%" stop-color="#e7c88c"/>
      <stop offset="100%" stop-color="#a47a2a"/>
    </linearGradient>
    <linearGradient id="tealGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe0c8"/>
      <stop offset="100%" stop-color="#137d72"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad2)"/>
  <!-- Dynamic speed lines -->
  <g stroke="#ffffff0a" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="40" x2="140" y2="40"/>
    <line x1="10" y1="80" x2="180" y2="80"/>
    <line x1="30" y1="160" x2="160" y2="160"/>
    <line x1="15" y1="200" x2="120" y2="200"/>
    <line x1="260" y1="30" x2="380" y2="30"/>
    <line x1="240" y1="70" x2="390" y2="70"/>
    <line x1="270" y1="170" x2="385" y2="170"/>
  </g>
  <!-- Central Circular Speed Dial & Stopwatch -->
  <g transform="translate(200, 120)">
    <!-- Outer dashed pulse ring -->
    <circle r="76" fill="none" stroke="#e7c88c33" stroke-width="2" stroke-dasharray="6 6"/>
    <!-- Glowing track -->
    <circle r="66" fill="#142c46" stroke="#ffffff15" stroke-width="8"/>
    <!-- Active teal progress arc -->
    <circle r="66" fill="none" stroke="url(#tealGrad2)" stroke-width="8" stroke-dasharray="415" stroke-dashoffset="110" stroke-linecap="round" transform="rotate(-90)"/>
    <!-- Stopwatch top crown & loops -->
    <rect x="-6" y="-84" width="12" height="12" rx="2" fill="url(#goldGrad2)"/>
    <path d="M-14 -78h28" stroke="url(#goldGrad2)" stroke-width="3" stroke-linecap="round"/>
    <!-- Central Lightning Section Badge -->
    <polygon points="-4,-28 14,-28 2,-2 18,-2 -14,32 -2,6 -16,6" fill="url(#goldGrad2)" filter="drop-shadow(0 2px 8px rgba(231,200,140,0.5))"/>
    <text x="0" y="46" fill="#e0edf4" font-size="11" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" letter-spacing="1">RAPID SPRINT</text>
  </g>
</svg>
