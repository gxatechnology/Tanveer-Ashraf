<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="wallLex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1928"/>
      <stop offset="60%" stop-color="#142c46"/>
      <stop offset="100%" stop-color="#182e42"/>
    </linearGradient>
    <linearGradient id="shelfWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24140b"/>
      <stop offset="50%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#1f1008"/>
    </linearGradient>
    <radialGradient id="lampGlowLex" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#dfbf804d"/>
      <stop offset="50%" stop-color="#dfbf801a"/>
      <stop offset="100%" stop-color="#dfbf8000"/>
    </radialGradient>
    <linearGradient id="deskLex" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b2112"/>
      <stop offset="20%" stop-color="#4d2c18"/>
      <stop offset="100%" stop-color="#221208"/>
    </linearGradient>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#eed8b7"/>
    </linearGradient>
  </defs>

  <!-- Background Wall -->
  <rect width="800" height="450" fill="url(#wallLex)"/>

  <!-- Grand Arched Library Window in Center Background -->
  <g opacity="0.6">
    <path d="M330 200V80a70 70 0 0 1 140 0v120z" fill="#081422" stroke="#dfbf8066" stroke-width="3"/>
    <!-- Window Panes -->
    <path d="M400 10v190M330 80h140M330 140h140" stroke="#dfbf8044" stroke-width="2"/>
    <!-- Subtle Starlight outside window -->
    <circle cx="370" cy="50" r="1.5" fill="#fdf2d0"/>
    <circle cx="430" cy="70" r="1" fill="#fdf2d0"/>
    <circle cx="390" cy="110" r="1.5" fill="#fdf2d0"/>
  </g>

  <!-- Massive Wooden Bookshelves Left & Right -->
  <!-- Left Bookshelf -->
  <rect x="0" y="0" width="220" height="340" fill="url(#shelfWood)" stroke="#dfbf8033" stroke-width="2"/>
  <!-- Shelves -->
  <rect x="10" y="70" width="200" height="12" fill="#54301a"/>
  <rect x="10" y="150" width="200" height="12" fill="#54301a"/>
  <rect x="10" y="230" width="200" height="12" fill="#54301a"/>
  <rect x="10" y="310" width="200" height="12" fill="#54301a"/>

  <!-- Leather-bound Books (Left Shelf) -->
  <!-- Shelf 1 Books -->
  <rect x="20" y="15" width="22" height="55" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="44" y="20" width="18" height="50" rx="2" fill="#1b4d3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="64" y="12" width="25" height="58" rx="2" fill="#1b2a4a" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="91" y="22" width="20" height="48" rx="2" fill="#8c5825" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="113" y="14" width="26" height="56" rx="2" fill="#382142" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="141" y="18" width="22" height="52" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="165" y="25" width="28" height="45" rx="2" fill="#176d63" stroke="#dfbf80" stroke-width="0.8"/>
  
  <!-- Shelf 2 Books -->
  <rect x="25" y="90" width="26" height="60" rx="2" fill="#1e3a5f" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="53" y="95" width="22" height="55" rx="2" fill="#8c3328" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="77" y="86" width="30" height="64" rx="2" fill="#2d4a3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="110" y="98" width="19" height="52" rx="2" fill="#523924" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="131" y="92" width="27" height="58" rx="2" fill="#1e3a5f" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="160" y="102" width="32" height="48" rx="2" fill="#6b2130" stroke="#dfbf80" stroke-width="0.8"/>

  <!-- Shelf 3 Books -->
  <rect x="22" y="172" width="24" height="58" rx="2" fill="#176d63" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="48" y="168" width="28" height="62" rx="2" fill="#192841" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="78" y="176" width="20" height="54" rx="2" fill="#69371d" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="100" y="170" width="32" height="60" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="134" y="180" width="24" height="50" rx="2" fill="#2d4a3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="160" y="174" width="28" height="56" rx="2" fill="#192841" stroke="#dfbf80" stroke-width="0.8"/>

  <!-- Right Bookshelf -->
  <rect x="580" y="0" width="220" height="340" fill="url(#shelfWood)" stroke="#dfbf8033" stroke-width="2"/>
  <rect x="590" y="70" width="200" height="12" fill="#54301a"/>
  <rect x="590" y="150" width="200" height="12" fill="#54301a"/>
  <rect x="590" y="230" width="200" height="12" fill="#54301a"/>
  <rect x="590" y="310" width="200" height="12" fill="#54301a"/>

  <!-- Right Shelf Books -->
  <rect x="600" y="14" width="28" height="56" rx="2" fill="#192841" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="630" y="20" width="20" height="50" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="652" y="12" width="26" height="58" rx="2" fill="#176d63" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="680" y="24" width="32" height="46" rx="2" fill="#523924" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="714" y="16" width="22" height="54" rx="2" fill="#1b4d3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="738" y="22" width="28" height="48" rx="2" fill="#6b2130" stroke="#dfbf80" stroke-width="0.8"/>

  <rect x="605" y="90" width="24" height="60" rx="2" fill="#69371d" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="631" y="96" width="30" height="54" rx="2" fill="#192841" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="663" y="86" width="22" height="64" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="687" y="100" width="28" height="50" rx="2" fill="#176d63" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="717" y="92" width="25" height="58" rx="2" fill="#2d4a3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="744" y="98" width="26" height="52" rx="2" fill="#1e3a5f" stroke="#dfbf80" stroke-width="0.8"/>

  <rect x="602" y="172" width="28" height="58" rx="2" fill="#1b4d3e" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="632" y="168" width="22" height="62" rx="2" fill="#6b2130" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="656" y="178" width="30" height="52" rx="2" fill="#192841" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="688" y="170" width="24" height="60" rx="2" fill="#523924" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="714" y="182" width="28" height="48" rx="2" fill="#7a2a35" stroke="#dfbf80" stroke-width="0.8"/>
  <rect x="744" y="174" width="26" height="56" rx="2" fill="#176d63" stroke="#dfbf80" stroke-width="0.8"/>

  <!-- Warm Overhead Banker's Lamp Glow -->
  <ellipse cx="400" cy="280" rx="320" ry="160" fill="url(#lampGlowLex)"/>

  <!-- Grand Polished Mahogany Puzzle Desk -->
  <polygon points="120,450 680,450 640,290 160,290" fill="url(#deskLex)"/>
  <rect x="156" y="286" width="488" height="12" fill="#54301a" stroke="#dfbf8066" stroke-width="1.5"/>

  <!-- Emerald Green & Brass Banker's Lamp on Desk -->
  <g transform="translate(230, 240)">
    <!-- Base -->
    <ellipse cx="25" cy="55" rx="18" ry="6" fill="#a4752c" stroke="#dfbf80" stroke-width="1"/>
    <!-- Stem -->
    <path d="M25 55c0-20 10-35 15-40" stroke="#dfbf80" stroke-width="4" fill="none"/>
    <!-- Shade -->
    <ellipse cx="40" cy="15" rx="26" ry="10" fill="#13534c" stroke="#dfbf80" stroke-width="1.5"/>
    <!-- Inner Bulb Glow -->
    <ellipse cx="40" cy="18" rx="18" ry="6" fill="#fff5d6" opacity="0.8"/>
  </g>

  <!-- Open Parchment Crossword Folio on Desk -->
  <g transform="translate(300, 305)">
    <!-- Folio Backing -->
    <rect x="0" y="0" width="200" height="130" rx="4" fill="#1c2024" stroke="#dfbf80" stroke-width="1.5"/>
    <!-- Left Parchment Page -->
    <rect x="6" y="6" width="90" height="118" rx="2" fill="url(#parchment)"/>
    <!-- Crossword Grid on Left Page -->
    <g transform="translate(16, 20)">
      <rect width="70" height="70" fill="#ffffff" stroke="#1c2e40" stroke-width="1"/>
      <!-- Grid Cells -->
      <g stroke="#1c2e40" stroke-width="0.8">
        <line x1="14" y1="0" x2="14" y2="70"/>
        <line x1="28" y1="0" x2="28" y2="70"/>
        <line x1="42" y1="0" x2="42" y2="70"/>
        <line x1="56" y1="0" x2="56" y2="70"/>
        <line x1="0" y1="14" x2="70" y2="14"/>
        <line x1="0" y1="28" x2="70" y2="28"/>
        <line x1="0" y1="42" x2="70" y2="42"/>
        <line x1="0" y1="56" x2="70" y2="56"/>
      </g>
      <!-- Blacked cells -->
      <rect x="14" y="0" width="14" height="14" fill="#1c2e40"/>
      <rect x="42" y="28" width="14" height="14" fill="#1c2e40"/>
      <rect x="0" y="42" width="14" height="14" fill="#1c2e40"/>
      <rect x="56" y="56" width="14" height="14" fill="#1c2e40"/>
      <!-- Highlighted Gold Word -->
      <rect x="28" y="14" width="14" height="14" fill="#dfbf8066"/>
      <rect x="28" y="28" width="14" height="14" fill="#dfbf8066"/>
      <rect x="28" y="42" width="14" height="14" fill="#dfbf8066"/>
      <text x="35" y="25" font-size="8" font-family="sans-serif" font-weight="bold" fill="#1c2e40" text-anchor="middle">L</text>
      <text x="35" y="39" font-size="8" font-family="sans-serif" font-weight="bold" fill="#1c2e40" text-anchor="middle">A</text>
      <text x="35" y="53" font-size="8" font-family="sans-serif" font-weight="bold" fill="#1c2e40" text-anchor="middle">W</text>
    </g>

    <!-- Right Parchment Page (Clues List) -->
    <rect x="104" y="6" width="90" height="118" rx="2" fill="url(#parchment)"/>
    <text x="149" y="20" font-family="Georgia, serif" font-size="8" font-weight="bold" fill="#7a2a35" text-anchor="middle">LEXICON CLUES</text>
    <!-- Clue lines -->
    <line x1="112" y1="30" x2="186" y2="30" stroke="#875333" stroke-width="1.5"/>
    <line x1="112" y1="38" x2="175" y2="38" stroke="#875333" stroke-width="1"/>
    <line x1="112" y1="46" x2="182" y2="46" stroke="#875333" stroke-width="1"/>
    <line x1="112" y1="58" x2="186" y2="58" stroke="#875333" stroke-width="1.5"/>
    <line x1="112" y1="66" x2="170" y2="66" stroke="#875333" stroke-width="1"/>
    <line x1="112" y1="74" x2="180" y2="74" stroke="#875333" stroke-width="1"/>
    <line x1="112" y1="86" x2="186" y2="86" stroke="#875333" stroke-width="1.5"/>
    <line x1="112" y1="94" x2="178" y2="94" stroke="#875333" stroke-width="1"/>
    <line x1="112" y1="102" x2="165" y2="102" stroke="#875333" stroke-width="1"/>
  </g>

  <!-- Brass Inkwell & Goose Feather Quill -->
  <g transform="translate(520, 325)">
    <!-- Inkwell Base -->
    <polygon points="10,35 30,35 34,48 6,48" fill="#a4752c" stroke="#dfbf80" stroke-width="1"/>
    <!-- Ink Opening -->
    <ellipse cx="20" cy="35" rx="7" ry="2.5" fill="#1c2024"/>
    <!-- Goose Feather Quill -->
    <path d="M22 35c10-25 35-50 48-60-2 8-8 25-18 42-6 10-18 20-30 18z" fill="#fdfcf8" stroke="#cbd5e1" stroke-width="0.8"/>
    <line x1="22" y1="35" x2="70" y2="-25" stroke="#875333" stroke-width="1"/>
  </g>

  <!-- Brass Balance Scales of Justice on Right Desk Edge -->
  <g transform="translate(575, 275)">
    <!-- Central Pillar -->
    <line x1="30" y1="45" x2="30" y2="10" stroke="#dfbf80" stroke-width="2.5"/>
    <!-- Base -->
    <ellipse cx="30" cy="46" rx="14" ry="4" fill="#a4752c" stroke="#dfbf80" stroke-width="1"/>
    <!-- Crossbeam -->
    <line x1="10" y1="15" x2="50" y2="15" stroke="#dfbf80" stroke-width="2"/>
    <!-- Left Pan Strings & Pan -->
    <line x1="10" y1="15" x2="5" y2="28" stroke="#dfbf80" stroke-width="0.8"/>
    <line x1="10" y1="15" x2="15" y2="28" stroke="#dfbf80" stroke-width="0.8"/>
    <path d="M2 28c3 5 11 5 16 0z" fill="#dfbf80"/>
    <!-- Right Pan Strings & Pan -->
    <line x1="50" y1="15" x2="45" y2="28" stroke="#dfbf80" stroke-width="0.8"/>
    <line x1="50" y1="15" x2="55" y2="28" stroke="#dfbf80" stroke-width="0.8"/>
    <path d="M42 28c3 5 11 5 16 0z" fill="#dfbf80"/>
  </g>

  <!-- Room Name Title Banner Plate -->
  <g transform="translate(270, 15)">
    <rect width="260" height="28" rx="6" fill="#142c46f0" stroke="#dfbf80" stroke-width="1.5"/>
    <text x="130" y="19" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#dfbf80" text-anchor="middle" letter-spacing="1.5">THE LEXICON CHAMBER</text>
  </g>
</svg>