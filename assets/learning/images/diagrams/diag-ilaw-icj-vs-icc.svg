<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Comparative Jurisprudence: ICJ vs ICC</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Critical Distinction for UP PCS-J Paper II: State Responsibility vs Individual Criminal Liability</text>

  <!-- ICJ Column -->
  <rect x="50" y="105" width="335" height="325" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <rect x="50" y="105" width="335" height="35" rx="6" fill="#137d72"/>
  <text x="217" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">International Court of Justice (ICJ)</text>

  <text x="70" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Institutional Character:</text>
  <text x="80" y="176" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Principal judicial organ of the UN (Art. 92 UN Charter)</text>

  <text x="70" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Jurisdiction Target (Ratione Personae):</text>
  <text x="80" y="216" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#137d72">STATES ONLY (Article 34(1) ICJ Statute)</text>
  <text x="80" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#607387">No individuals, NGOs or corporations can be parties.</text>

  <text x="70" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Basis of Jurisdiction:</text>
  <text x="80" y="272" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">State Consent (Special Agreement, Compromissory Clause, Art. 36(2) Optional Clause Declaration)</text>

  <text x="70" y="296" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Composition &amp; Seat:</text>
  <text x="80" y="312" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Peace Palace, The Hague · 15 Judges (9-yr terms)</text>

  <text x="70" y="336" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Core Functions:</text>
  <text x="80" y="352" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">1. Contentious Disputes between States (Binding)</text>
  <text x="80" y="368" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">2. Advisory Opinions requested by GA / SC (Non-binding)</text>

  <text x="70" y="392" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#137d72">• Landmark: Kulbhushan Jadhav Case (India v. Pakistan)</text>
  <text x="80" y="410" font-family="system-ui, sans-serif" font-size="9.5" fill="#607387">Violation of Art. 36 VCCR (Consular Access granted)</text>

  <!-- ICC Column -->
  <rect x="415" y="105" width="335" height="325" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <rect x="415" y="105" width="335" height="35" rx="6" fill="#dfbf80"/>
  <text x="582" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">International Criminal Court (ICC)</text>

  <text x="435" y="160" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Institutional Character:</text>
  <text x="445" y="176" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Independent treaty-based court (Rome Statute 1998, in force 2002)</text>

  <text x="435" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Jurisdiction Target (Ratione Personae):</text>
  <text x="445" y="216" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#b98a38">NATURAL INDIVIDUALS ONLY (Art. 25 Rome Statute)</text>
  <text x="445" y="232" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Presidents, military commanders, warlords.</text>

  <text x="435" y="256" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Four Specified International Crimes (Art. 5):</text>
  <text x="445" y="272" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Genocide (Art. 6) · Crimes Against Humanity (Art. 7) · War Crimes (Art. 8) · Aggression (Art. 8 bis)</text>

  <text x="435" y="296" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Complementarity Principle (Art. 17):</text>
  <text x="445" y="312" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">ICC acts ONLY when domestic courts are unable or unwilling genuine national proceedings.</text>

  <text x="435" y="336" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">• Composition &amp; Seat:</text>
  <text x="445" y="352" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">The Hague, Netherlands · 18 Judges (9-yr non-renewable)</text>

  <text x="435" y="376" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">• India's Status:</text>
  <text x="445" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#e53e3e">NOT a State Party to Rome Statute</text>
  <text x="445" y="410" font-family="system-ui, sans-serif" font-size="9.5" fill="#607387">Concerns regarding state sovereignty &amp; UNSC referral powers</text>

  <!-- Bottom Key Exam Tip -->
  <text x="400" y="450" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">EXAM TRAP: ICJ decides dispute between nations; ICC prosecutes individual war criminals.</text>
</svg>