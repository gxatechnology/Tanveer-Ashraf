<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#142c46"/><stop offset="100%" stop-color="#1b3857"/></linearGradient>
  </defs>
  <rect width="920" height="400" fill="url(#bg)" rx="12"/>
  <text x="460" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#dfbf80">TIMELINE OF ANCIENT INDIAN CIVILIZATION &amp; DYNASTIES</text>
  <text x="460" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Chronological Evolution from Indus Valley to the Classical Gupta Empire (UP PCS-J High-Yield)</text>

  <!-- Central Chronology Axis -->
  <line x1="50" y1="180" x2="870" y2="180" stroke="#dfbf80" stroke-width="4"/>
  <polygon points="870,180 855,173 855,187" fill="#dfbf80"/>

  <!-- Milestone 1: IVC -->
  <circle cx="110" cy="180" r="8" fill="#137d72" stroke="#dfbf80" stroke-width="2"/>
  <rect x="35" y="80" width="150" height="85" rx="6" fill="#ffffff"/>
  <rect x="35" y="80" width="150" height="22" rx="6" fill="#137d72"/>
  <text x="110" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">INDUS VALLEY (IVC)</text>
  <text x="45" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#142c46">• c. 2600 – 1900 BCE</text>
  <text x="45" y="133" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Urban planning, Grid cities</text>
  <text x="45" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Harappa, Mohenjo-daro</text>

  <!-- Milestone 2: Vedic Age -->
  <circle cx="260" cy="180" r="8" fill="#142c46" stroke="#dfbf80" stroke-width="2"/>
  <rect x="185" y="200" width="150" height="85" rx="6" fill="#ffffff"/>
  <rect x="185" y="200" width="150" height="22" rx="6" fill="#142c46"/>
  <text x="260" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">VEDIC PERIOD</text>
  <text x="195" y="238" font-family="system-ui, sans-serif" font-size="9" fill="#142c46">• c. 1500 – 600 BCE</text>
  <text x="195" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Rigveda &amp; Later Vedas</text>
  <text x="195" y="268" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Janapadas, Sabha &amp; Samiti</text>

  <!-- Milestone 3: Mahajanapadas & Buddhism -->
  <circle cx="410" cy="180" r="8" fill="#137d72" stroke="#dfbf80" stroke-width="2"/>
  <rect x="335" y="80" width="150" height="85" rx="6" fill="#ffffff"/>
  <rect x="335" y="80" width="150" height="22" rx="6" fill="#137d72"/>
  <text x="410" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">MAHAJANAPADAS</text>
  <text x="345" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#142c46">• 6th Century BCE</text>
  <text x="345" y="133" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Magadha rise; 16 States</text>
  <text x="345" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Buddha &amp; Mahavira</text>

  <!-- Milestone 4: Mauryan Empire -->
  <circle cx="560" cy="180" r="8" fill="#142c46" stroke="#dfbf80" stroke-width="2"/>
  <rect x="485" y="200" width="150" height="85" rx="6" fill="#ffffff"/>
  <rect x="485" y="200" width="150" height="22" rx="6" fill="#142c46"/>
  <text x="560" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">MAURYAN EMPIRE</text>
  <text x="495" y="238" font-family="system-ui, sans-serif" font-size="9" fill="#142c46">• 322 – 185 BCE</text>
  <text x="495" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Chandragupta &amp; Ashoka</text>
  <text x="495" y="268" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Edicts, Arthashastra, Dhamma</text>

  <!-- Milestone 5: Post-Mauryan & Kushanas -->
  <circle cx="710" cy="180" r="8" fill="#137d72" stroke="#dfbf80" stroke-width="2"/>
  <rect x="635" y="80" width="150" height="85" rx="6" fill="#ffffff"/>
  <rect x="635" y="80" width="150" height="22" rx="6" fill="#137d72"/>
  <text x="710" y="96" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">KUSHANA &amp; SANGAM</text>
  <text x="645" y="118" font-family="system-ui, sans-serif" font-size="9" fill="#142c46">• 2nd BCE – 3rd CE</text>
  <text x="645" y="133" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Kanishka (Shaka Era 78 CE)</text>
  <text x="645" y="148" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Gandhara &amp; Mathura Art</text>

  <!-- Milestone 6: Gupta Classical Age -->
  <circle cx="830" cy="180" r="8" fill="#dfbf80" stroke="#142c46" stroke-width="2"/>
  <rect x="755" y="200" width="145" height="85" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <rect x="755" y="200" width="145" height="22" rx="6" fill="#137d72"/>
  <text x="827" y="216" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">GUPTA EMPIRE</text>
  <text x="765" y="238" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">• 319 – 550 CE</text>
  <text x="765" y="253" font-family="system-ui, sans-serif" font-size="9" fill="#607387">• Samudragupta / Prayag Prasasti</text>
  <text x="765" y="268" font-family="system-ui, sans-serif" font-size="9" fill="#137d72">• Kalidasa, Aryabhata</text>

  <!-- Footer Insight -->
  <rect x="40" y="320" width="840" height="55" rx="8" fill="#102847" stroke="#dfbf80" stroke-width="1"/>
  <text x="60" y="342" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#dfbf80">UP JUDICIAL EXAM TIP:</text>
  <text x="60" y="360" font-family="system-ui, sans-serif" font-size="9.5" fill="#e2e8f0">Prayag Prashasti (Allahabad Pillar Inscription) composed by Harishena in Sanskrit describes Samudragupta's Digvijaya and administrative titles.</text>
</svg>
