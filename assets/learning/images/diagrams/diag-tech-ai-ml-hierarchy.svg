<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Artificial Intelligence &amp; Emerging Technologies Hierarchy</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">From Broad Artificial Intelligence to Deep Learning &amp; Generative Foundation Models</text>

  <!-- Concentric Enclosures / Stack -->
  <!-- Level 1: Artificial Intelligence (Outer) -->
  <rect x="60" y="105" width="680" height="310" rx="8" fill="#edf2f7" stroke="#142c46" stroke-width="2"/>
  <text x="80" y="130" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">1. ARTIFICIAL INTELLIGENCE (AI)</text>
  <text x="80" y="148" font-family="system-ui, sans-serif" font-size="10.5" fill="#607387">Broad science of creating machines that simulate human cognitive intelligence, logic, reasoning &amp; perception.</text>

  <!-- Level 2: Machine Learning (Middle) -->
  <rect x="100" y="165" width="600" height="230" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <text x="120" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#137d72">2. MACHINE LEARNING (ML)</text>
  <text x="120" y="206" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Subfield where systems learn from statistical data without explicit rule-based programming (Supervised, Unsupervised, Reinforcement).</text>

  <!-- Level 3: Deep Learning (Inner) -->
  <rect x="140" y="225" width="520" height="150" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <text x="160" y="250" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#b98a38">3. DEEP LEARNING (DL)</text>
  <text x="160" y="266" font-family="system-ui, sans-serif" font-size="9.5" fill="#4a5568">Multi-layered Artificial Neural Networks (ANNs, CNNs for computer vision, RNNs/Transformers for sequences).</text>

  <!-- Level 4: Generative AI & LLMs (Core) -->
  <rect x="180" y="285" width="440" height="75" rx="6" fill="#142c46"/>
  <text x="400" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dfbf80">4. GENERATIVE AI &amp; LARGE LANGUAGE MODELS (LLMs)</text>
  <text x="400" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">Transformer Architecture · Self-Attention Mechanism · Foundation Models (Text, Code, Vision)</text>
  <text x="400" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfbf80">Indian Ecosystem: Bhashini (Translation), BharatGPT, National AI Portal (INDIAai)</text>

  <!-- Footer Application in Judiciary -->
  <rect x="60" y="425" width="680" height="35" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="400" y="447" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#137d72"><strong>Judicial AI Applications:</strong> SUVAS (Supreme Court Vidhik Anuvaad Software) · SUPACE (Supreme Court Portal for Assistance in Court's Efficiency)</text>
</svg>