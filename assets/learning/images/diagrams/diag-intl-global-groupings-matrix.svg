<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Multilateral &amp; Regional Strategic Groupings Architecture</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Distinguishing Formal Treaty Organizations from Consultative Economic &amp; Security Blocs</text>

  <!-- Group A: Comprehensive Intergovernmental -->
  <rect x="50" y="105" width="220" height="150" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <text x="160" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#137d72">Regional Blocs</text>
  <text x="65" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">SAARC (Est. 1985)</text>
  <text x="65" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">HQ: Kathmandu · 8 Members</text>
  <text x="65" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">BIMSTEC (Est. 1997)</text>
  <text x="65" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">HQ: Dhaka · Bay of Bengal Littoral</text>
  <text x="65" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">ASEAN (Est. 1967)</text>
  <text x="65" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">HQ: Jakarta · 10 SE Asian States</text>

  <!-- Group B: Major Global Economic & Strategic Coalitions -->
  <rect x="290" y="105" width="220" height="150" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <text x="400" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b98a38">Global Coalitions</text>
  <text x="305" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">G20 (19 + EU + African Union)</text>
  <text x="305" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Troika Leadership · No Permanent HQ</text>
  <text x="305" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">BRICS (BRICS Plus Expansion)</text>
  <text x="305" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">New Development Bank (NDB - Shanghai)</text>
  <text x="305" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">SCO (Shanghai Cooperation)</text>
  <text x="305" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">HQ: Beijing · RATS: Tashkent</text>

  <!-- Group C: Plurilateral & Specialized -->
  <rect x="530" y="105" width="220" height="150" rx="6" fill="#f8fafc" stroke="#142c46" stroke-width="1.5"/>
  <text x="640" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Strategic Dialogues</text>
  <text x="545" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">QUAD (Quadrilateral Dialogue)</text>
  <text x="545" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">India, US, Japan, Australia</text>
  <text x="545" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">I2U2 Grouping</text>
  <text x="545" y="205" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">India, Israel, UAE, USA</text>
  <text x="545" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">IBSA Dialogue Forum</text>
  <text x="545" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">India, Brazil, South Africa</text>

  <!-- Comparative Dimension Table -->
  <rect x="50" y="275" width="700" height="120" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="275" width="700" height="30" fill="#142c46" rx="6"/>
  <text x="120" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Entity</text>
  <text x="240" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Legal Status</text>
  <text x="410" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Headquarters / Secretarial Base</text>
  <text x="630" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">India's Stance</text>

  <text x="120" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">WTO</text>
  <text x="240" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Formal Treaty (Marrakesh 1994)</text>
  <text x="410" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Geneva, Switzerland</text>
  <text x="630" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#137d72">Founding Member (GATT 1948)</text>

  <text x="120" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">G20</text>
  <text x="240" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Informal Consultative Forum</text>
  <text x="410" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Rotating Presidency (Troika)</text>
  <text x="630" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#137d72">Presidency 2023 (New Delhi Declaration)</text>

  <text x="120" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">BRICS</text>
  <text x="240" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Plurilateral Economic Forum</text>
  <text x="410" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">NDB: Shanghai, China</text>
  <text x="630" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#137d72">Founding Leader (First NDB Chief: KV Kamath)</text>

  <!-- Footer -->
  <rect x="50" y="415" width="700" height="35" rx="4" fill="#edf7f4"/>
  <text x="400" y="437" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#137d72">Strategic Note: Treaties create formal international legal obligations; summits create political declarations.</text>
</svg>