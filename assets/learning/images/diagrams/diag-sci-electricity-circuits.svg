<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Electricity Fundamentals: Ohm's Law &amp; Circuit Laws</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Potential Difference (V) · Current (I) · Resistance (R) · Series vs Parallel Connections</text>

  <!-- Ohm's Law Formula Card -->
  <rect x="50" y="105" width="220" height="160" rx="6" fill="#142c46"/>
  <text x="160" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dfbf80">Ohm's Law (V = I × R)</text>
  <text x="160" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff">V = I · R</text>
  <text x="70" y="200" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfbf80">• V: Potential (Volts)</text>
  <text x="70" y="220" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfbf80">• I: Current (Amperes)</text>
  <text x="70" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#dfbf80">• R: Resistance (Ohms, &Omega;)</text>

  <!-- Series Circuit Panel -->
  <rect x="290" y="105" width="225" height="160" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <text x="402" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#137d72">Series Combination</text>
  <text x="310" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">R_total = R₁ + R₂ + R₃</text>
  <text x="310" y="175" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Current (I) remains constant</text>
  <text x="310" y="195" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Voltage divides across resistors</text>
  <text x="310" y="215" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Total resistance increases</text>
  <text x="310" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#e53e3e">• One break stops whole circuit</text>

  <!-- Parallel Circuit Panel -->
  <rect x="535" y="105" width="215" height="160" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <text x="642" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12.5" font-weight="bold" fill="#b98a38">Parallel Combination</text>
  <text x="555" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">1/R_total = 1/R₁ + 1/R₂</text>
  <text x="555" y="175" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Voltage (V) remains constant</text>
  <text x="555" y="195" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Current divides into branches</text>
  <text x="555" y="215" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Total resistance decreases</text>
  <text x="555" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#137d72">• Standard Domestic Wiring</text>

  <!-- Domestic Household Electric Safety -->
  <rect x="50" y="280" width="700" height="140" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="280" width="700" height="30" fill="#142c46" rx="6"/>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#dfbf80">Domestic Power Supply in India: 220 V AC, 50 Hz Frequency</text>

  <text x="70" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">1. Three-Pin Plug Wiring:</text>
  <text x="85" y="355" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Live Wire (Red / Brown): Carries high potential (220V)</text>
  <text x="85" y="375" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Neutral Wire (Black / Blue): Completes circuit at 0V</text>
  <text x="85" y="395" font-family="system-ui, sans-serif" font-size="10.5" fill="#137d72">• Earth Wire (Green / Yellow): Safety wire connected to metallic body</text>

  <text x="430" y="335" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">2. Safety Devices (Fuse vs MCB):</text>
  <text x="445" y="355" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Electric Fuse: Tin-Lead alloy (Low melting point, high resistance)</text>
  <text x="445" y="375" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• MCB (Miniature Circuit Breaker): Magnetic/thermal tripping</text>
  <text x="445" y="395" font-family="system-ui, sans-serif" font-size="10.5" fill="#142c46">• Electric Power: P = V × I = I²R = V²/R (Unit: Watt / kWh unit)</text>

  <!-- Footer -->
  <text x="400" y="445" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">1 Commercial Unit of Electricity = 1 Kilowatt-hour (kWh) = 3.6 × 10⁶ Joules (J)</text>
</svg>