<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs><linearGradient id="nibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#142c46"/><stop offset="100%" stop-color="#1b3857"/></linearGradient></defs>
  <rect width="920" height="370" fill="url(#nibg)" rx="12"/>
  <text x="460" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#dfbf80">NATIONAL INCOME ACCOUNTING &amp; AGGREGATES (CSO/MoSPI)</text>
  <text x="460" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Transition Formulas: GDP, GVA, Factor Cost to Market Price, Depreciation &amp; NFIA</text>

  <g transform="translate(30, 75)">
    <!-- Box 1: Gross Domestic Product -->
    <rect x="0" y="0" width="200" height="135" rx="8" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#142c46"/>
    <text x="100" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">1. GDP (DOMESTIC OUTPUT)</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">• Total money value of all final</text>
    <text x="12" y="58" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  goods &amp; services produced</text>
    <text x="12" y="72" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  within geographic boundary</text>
    <text x="12" y="86" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  in one financial year.</text>
    <text x="12" y="106" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#137d72">• Expenditure Method:</text>
    <text x="12" y="122" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a63b49">GDP = C + I + G + (X - M)</text>

    <!-- Arrow 1 to GNP -->
    <line x1="205" y1="67" x2="245" y2="67" stroke="#dfbf80" stroke-width="2.5"/>
    <text x="225" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dfbf80">+ NFIA</text>

    <!-- Box 2: Gross National Product -->
    <rect x="250" y="0" width="200" height="135" rx="8" fill="#ffffff"/>
    <rect x="250" y="0" width="200" height="26" rx="8" fill="#137d72"/>
    <text x="350" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">2. GNP (CITIZENS' OUTPUT)</text>
    <text x="262" y="44" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">• Total output produced by</text>
    <text x="262" y="58" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  normal residents of India</text>
    <text x="262" y="72" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  (at home or abroad).</text>
    <text x="262" y="94" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#137d72">GNP = GDP + NFIA</text>
    <text x="262" y="112" font-family="system-ui, sans-serif" font-size="8" fill="#607387">(Net Factor Income from Abroad =</text>
    <text x="262" y="124" font-family="system-ui, sans-serif" font-size="8" fill="#607387">Income earned by Indians abroad -</text>
    <text x="262" y="132" font-family="system-ui, sans-serif" font-size="8" fill="#607387">Income earned by foreigners in India)</text>

    <!-- Arrow 2 to NNP -->
    <line x1="455" y1="67" x2="495" y2="67" stroke="#dfbf80" stroke-width="2.5"/>
    <text x="475" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#dfbf80">- Depr</text>

    <!-- Box 3: Net National Product -->
    <rect x="500" y="0" width="200" height="135" rx="8" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
    <rect x="500" y="0" width="200" height="26" rx="8" fill="#142c46"/>
    <text x="600" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">3. NNP (NATIONAL INCOME)</text>
    <text x="512" y="44" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">• Purest measure of national output</text>
    <text x="512" y="58" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">  after accounting for capital wear &amp; tear.</text>
    <text x="512" y="78" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#137d72">NNP = GNP - Depreciation</text>
    <text x="512" y="102" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a63b49">National Income (NI) =</text>
    <text x="512" y="118" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#a63b49">NNP at Factor Cost (FC)</text>
    <text x="512" y="132" font-family="system-ui, sans-serif" font-size="8" fill="#607387">Per Capita Income = NI / Population</text>

    <!-- Box 4: GVA vs GDP -->
    <rect x="715" y="0" width="145" height="135" rx="8" fill="#ffffff"/>
    <rect x="715" y="0" width="145" height="26" rx="8" fill="#137d72"/>
    <text x="787" y="18" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-weight="bold" fill="#fff">4. GVA (SECTORAL)</text>
    <text x="723" y="44" font-family="system-ui, sans-serif" font-size="8" fill="#142c46">• Producer/supply side</text>
    <text x="723" y="58" font-family="system-ui, sans-serif" font-size="8" fill="#607387">• Output - Intermediates</text>
    <text x="723" y="74" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#142c46">Headline Relationship:</text>
    <text x="723" y="90" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#137d72">GDP at MP =</text>
    <text x="723" y="102" font-family="system-ui, sans-serif" font-size="8" fill="#137d72">GVA at basic prices +</text>
    <text x="723" y="114" font-family="system-ui, sans-serif" font-size="8" fill="#137d72">Product Taxes -</text>
    <text x="723" y="126" font-family="system-ui, sans-serif" font-size="8" fill="#137d72">Product Subsidies</text>
  </g>

  <!-- Bottom Transition Formulas -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="860" height="120" rx="8" fill="#102847" stroke="#dfbf80" stroke-width="1"/>
    <text x="20" y="24" font-family="Georgia, serif" font-size="12" font-weight="bold" fill="#dfbf80">CRITICAL UP PCS-J CONVERSION RULES &amp; METHODOLOGY (BASE YEAR 2011–12):</text>
    <text x="20" y="46" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff">1. GROSS vs NET: Gross = Net + Depreciation (Consumption of Fixed Capital)</text>
    <text x="20" y="64" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff">2. DOMESTIC vs NATIONAL: National = Domestic + NFIA (Net Factor Income from Abroad)</text>
    <text x="20" y="82" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff">3. MARKET PRICE vs FACTOR COST: Market Price (MP) = Factor Cost (FC) + Net Indirect Taxes (Indirect Taxes - Subsidies)</text>
    <text x="20" y="100" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfbf80">4. NOMINAL vs REAL: Real GDP = (Nominal GDP / GDP Deflator) × 100 (Adjusted for price inflation over 2011–12 base)</text>
  </g>
</svg>
