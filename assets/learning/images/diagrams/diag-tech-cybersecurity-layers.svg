<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Defense-in-Depth Cybersecurity Architecture &amp; Threat Vectors</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Indian Institutional Shield: CERT-In, NCIIPC &amp; Information Technology Act, 2000</text>

  <!-- 4 Concentric Defense Rings -->
  <!-- Layer 1: Perimeter / Network Security -->
  <rect x="50" y="105" width="700" height="60" rx="6" fill="#142c46"/>
  <text x="70" y="130" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#dfbf80">Layer 1: Perimeter &amp; Network Defense</text>
  <text x="70" y="150" font-family="system-ui, sans-serif" font-size="10.5" fill="#ffffff">Firewalls, DDoS Mitigation, Virtual Private Networks (VPN), Intrusion Detection &amp; Prevention Systems (IDS/IPS)</text>

  <!-- Layer 2: Host & Endpoint Security -->
  <rect x="50" y="175" width="700" height="60" rx="6" fill="#137d72"/>
  <text x="70" y="200" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Layer 2: Host &amp; Endpoint Protection</text>
  <text x="70" y="220" font-family="system-ui, sans-serif" font-size="10.5" fill="#edf7f4">Antivirus/EDR Agents, OS Patch Management, Access Control Lists (ACLs), Device Management &amp; Hardening</text>

  <!-- Layer 3: Application Security -->
  <rect x="50" y="245" width="700" height="60" rx="6" fill="#dfbf80"/>
  <text x="70" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#142c46">Layer 3: Application &amp; API Security</text>
  <text x="70" y="290" font-family="system-ui, sans-serif" font-size="10.5" fill="#142c46">Secure Software Lifecycle, OWASP Top 10 Protections, Multi-Factor Authentication (MFA), Code Audits</text>

  <!-- Layer 4: Data Security (Core) -->
  <rect x="50" y="315" width="700" height="60" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <text x="70" y="340" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#137d72">Layer 4: Data-at-Rest &amp; Data-in-Transit Encryption (Core Vault)</text>
  <text x="70" y="360" font-family="system-ui, sans-serif" font-size="10.5" fill="#142c46">AES-256 Symmetric Encryption · RSA Asymmetric Cryptography · TLS 1.3 · Digital Personal Data Protection (DPDP) Act</text>

  <!-- Bottom Regulatory Bar -->
  <rect x="50" y="390" width="700" height="60" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="180" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">CERT-In (Sec 70B IT Act)</text>
  <text x="180" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#607387">Mandatory 6-hr incident reporting</text>

  <text x="400" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">NCIIPC (Sec 70 IT Act)</text>
  <text x="400" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#607387">Critical Info Infrastructure protection</text>

  <text x="620" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">I4C (Cybercrime Portal)</text>
  <text x="620" y="435" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9.5" fill="#607387">National Helpline 1930 &amp; portal</text>
</svg>