<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Evolution of ISRO Launch Vehicles</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">From SLV-3 (1980) to PSLV, GSLV, LVM3 &amp; SSLV · Solid, Liquid (Vikas) &amp; Cryogenic Stages</text>

  <!-- 4 Modern Vehicles Comparison -->
  <!-- 1. PSLV -->
  <rect x="50" y="105" width="165" height="240" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <text x="132" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#137d72">PSLV (Workhorse)</text>
  <text x="65" y="155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">4-Stage Propulsion:</text>
  <text x="65" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">1: Solid (HTPB)</text>
  <text x="65" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">2: Liquid (Vikas Engine)</text>
  <text x="65" y="204" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">3: Solid</text>
  <text x="65" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">4: Liquid</text>
  <text x="65" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">Payload Capacity:</text>
  <text x="65" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#137d72">~1,750 kg to Sun-Sync (SSO)</text>
  <text x="65" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">~1,425 kg to GTO</text>
  <text x="65" y="305" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#142c46">Famous Missions:</text>
  <text x="65" y="325" font-family="system-ui, sans-serif" font-size="9.5" fill="#137d72">Chandrayaan-1, Mangalyaan, Aditya-L1, 104 Satellites</text>

  <!-- 2. GSLV Mk II -->
  <rect x="225" y="105" width="165" height="240" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <text x="307" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#b98a38">GSLV Mk II</text>
  <text x="240" y="155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">3-Stage Propulsion:</text>
  <text x="240" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">1: Solid + 4 Liquid Strap-ons</text>
  <text x="240" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">2: Liquid (Vikas Engine)</text>
  <text x="240" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#b98a38">3: Indigenous Cryogenic (CUS - CE-7.5)</text>
  <text x="240" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#4a5568">Liquid H₂ (-253°C) &amp; O₂ (-183°C)</text>
  <text x="240" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">Payload Capacity:</text>
  <text x="240" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#b98a38">~2,250 kg to GTO</text>
  <text x="240" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">~5,000 kg to LEO</text>
  <text x="240" y="305" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#142c46">Famous Missions:</text>
  <text x="240" y="325" font-family="system-ui, sans-serif" font-size="9.5" fill="#b98a38">GSAT &amp; NavIC Satellites (NVS-01)</text>

  <!-- 3. LVM3 (Heavy Lifter) -->
  <rect x="400" y="105" width="170" height="240" rx="6" fill="#142c46"/>
  <text x="485" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#dfbf80">LVM3 (Bahubali)</text>
  <text x="415" y="155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">3-Stage Architecture:</text>
  <text x="415" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#dfbf80">S200: Two Solid Strap-ons</text>
  <text x="415" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#dfbf80">L110: Core Liquid (2 Vikas)</text>
  <text x="415" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">C25: Heavy Cryogenic (CE-20)</text>
  <text x="415" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfbf80">India's most powerful rocket</text>
  <text x="415" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#ffffff">Payload Capacity:</text>
  <text x="415" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#dfbf80">4,000 kg to GTO</text>
  <text x="415" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#ffffff">8,000 kg to LEO</text>
  <text x="415" y="305" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Famous Missions:</text>
  <text x="415" y="325" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfbf80">Chandrayaan-2, Chandrayaan-3, OneWeb (72 sats), Gaganyaan TV-D1</text>

  <!-- 4. SSLV -->
  <rect x="580" y="105" width="170" height="240" rx="6" fill="#f8fafc" stroke="#142c46" stroke-width="1.5"/>
  <text x="665" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">SSLV (Small Satellite)</text>
  <text x="595" y="155" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">Rapid Launch Vehicle:</text>
  <text x="595" y="172" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">3 Solid Stages</text>
  <text x="595" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Liquid Velocity Trimming (VTM)</text>
  <text x="595" y="204" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Low Cost &amp; Quick Turnaround</text>
  <text x="595" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Assembly in 72 hours</text>
  <text x="595" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">Payload Capacity:</text>
  <text x="595" y="262" font-family="system-ui, sans-serif" font-size="10" fill="#137d72">500 kg to 500 km LEO</text>
  <text x="595" y="280" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">300 kg to Sun-Sync (SSO)</text>
  <text x="595" y="305" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#142c46">Key Mandate:</text>
  <text x="595" y="325" font-family="system-ui, sans-serif" font-size="9.5" fill="#137d72">Commercial launches via NSIL &amp; Kulasekarapattinam spaceport</text>

  <!-- Historical & Center Timeline Footer -->
  <rect x="50" y="360" width="700" height="90" rx="6" fill="#edf7f4" stroke="#137d72"/>
  <text x="400" y="385" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#137d72">Major ISRO Space Centres &amp; Launch Infrastructure</text>
  <text x="400" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#142c46">Satish Dhawan Space Centre (SDSC SHAR, Sriharikota, AP) · Vikram Sarabhai Space Centre (VSSC, Thiruvananthapuram)</text>
  <text x="400" y="425" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">U R Rao Satellite Centre (URSC, Bengaluru) · Liquid Propulsion Systems Centre (LPSC, Valiamala) · Space Applications Centre (SAC, Ahmedabad)</text>
</svg>