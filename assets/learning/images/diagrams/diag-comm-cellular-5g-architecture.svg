<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">Telecommunications &amp; Cellular Network Architecture (2G to 5G NR)</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Evolution of Mobile Standards · Spectrum Allocation · Telecommunications Act, 2023</text>

  <!-- Generations Comparison Grid -->
  <rect x="50" y="105" width="165" height="180" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="50" y="105" width="165" height="35" rx="6" fill="#142c46"/>
  <text x="132" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">2G / 3G</text>
  <text x="65" y="160" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">GSM / CDMA / WCDMA</text>
  <text x="65" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Speed: 64 Kbps to 2 Mbps</text>
  <text x="65" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Circuit Switched Voice</text>
  <text x="65" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Packet Switched Data (GPRS)</text>
  <text x="65" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Historical Baseline</text>
  <text x="65" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#137d72">Voice &amp; Simple Web</text>

  <rect x="225" y="105" width="165" height="180" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <rect x="225" y="105" width="165" height="35" rx="6" fill="#137d72"/>
  <text x="307" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">4G LTE / VoLTE</text>
  <text x="240" y="160" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">All-IP Network</text>
  <text x="240" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Speed: Up to 100 Mbps</text>
  <text x="240" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">OFDMA / MIMO</text>
  <text x="240" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">VoLTE (Voice over LTE)</text>
  <text x="240" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Mass Data Revolution</text>
  <text x="240" y="265" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#137d72">Video &amp; High-Speed Net</text>

  <rect x="400" y="105" width="170" height="180" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <rect x="400" y="105" width="170" height="35" rx="6" fill="#dfbf80"/>
  <text x="485" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#142c46">5G New Radio (NR)</text>
  <text x="415" y="160" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">eMBB, uRLLC, mMTC</text>
  <text x="415" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Speed: Up to 10 Gbps</text>
  <text x="415" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Sub-1 ms Low Latency</text>
  <text x="415" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Network Slicing</text>
  <text x="415" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Beamforming &amp; Massive MIMO</text>
  <text x="415" y="265" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#b98a38">IoT, Telemedicine &amp; AI</text>

  <rect x="580" y="105" width="170" height="180" rx="6" fill="#f8fafc" stroke="#142c46"/>
  <rect x="580" y="105" width="170" height="35" rx="6" fill="#142c46"/>
  <text x="665" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Bharat 6G Mission</text>
  <text x="595" y="160" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" fill="#142c46">Terahertz (THz) Waves</text>
  <text x="595" y="180" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Speed: 1 Tbps (Target)</text>
  <text x="595" y="200" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Microsecond Latency</text>
  <text x="595" y="220" font-family="system-ui, sans-serif" font-size="10" fill="#4a5568">Holographic Comms</text>
  <text x="595" y="240" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Target Era: 2030</text>
  <text x="595" y="265" font-family="system-ui, sans-serif" font-size="9.5" fill="#dfbf80">Apex Council Oversight</text>

  <!-- Statutory & Regulatory Framework -->
  <rect x="50" y="305" width="700" height="135" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="50" y="305" width="700" height="30" fill="#142c46" rx="6"/>
  <text x="400" y="325" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#dfbf80">Statutory &amp; Institutional Governance of Indian Communications</text>

  <text x="70" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">Telecommunications Act, 2023:</text>
  <text x="70" y="380" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Repealed Indian Telegraph Act 1885 &amp; Wireless Telegraphy Act 1933</text>
  <text x="70" y="400" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• Spectrum assignment: Primary auction; administrative allocation for satellite &amp; defense</text>
  <text x="70" y="420" font-family="system-ui, sans-serif" font-size="10.5" fill="#137d72">• Digital Bharat Nidhi (formerly Universal Service Obligation Fund - USOF) for rural broadband</text>

  <text x="480" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#142c46">Regulatory Authorities:</text>
  <text x="480" y="380" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• TRAI (TRAI Act 1997): Tariff &amp; Interconnection Regulator</text>
  <text x="480" y="400" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">• TDSAT: Appellate Tribunal for Telecom &amp; Broadcasting</text>
  <text x="480" y="420" font-family="system-ui, sans-serif" font-size="10.5" fill="#142c46">• DoT (Department of Telecommunications): Licensing &amp; Policy</text>
</svg>