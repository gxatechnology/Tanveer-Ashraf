<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="100%">
  <defs><linearGradient id="dsbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#142c46"/><stop offset="100%" stop-color="#1b3857"/></linearGradient></defs>
  <rect width="920" height="370" fill="url(#dsbg)" rx="12"/>
  <text x="460" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#dfbf80">DELHI SULTANATE: FIVE DYNASTIES &amp; ADMINISTRATIVE EVOLUTION (1206–1526)</text>
  <text x="460" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Chronological Sequence, Key Rulers, Agrarian &amp; Military Reforms</text>

  <!-- 5 Dynasty Cards -->
  <g transform="translate(20, 80)">
    <!-- 1. Mamluk / Slave -->
    <rect x="0" y="0" width="165" height="190" rx="8" fill="#ffffff"/>
    <rect x="0" y="0" width="165" height="28" rx="8" fill="#142c46"/>
    <text x="82" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">MAMLUK (1206–90)</text>
    <text x="10" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#137d72">Qutbuddin Aibak (1206)</text>
    <text x="10" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">Lakh Baksh; Qutb Minar</text>
    <text x="10" y="80" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Iltutmish (1211–36)</text>
    <text x="10" y="94" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">Chahalgani; Iqta; Tanka</text>
    <text x="10" y="114" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Razia Sultan (1236–40)</text>
    <text x="10" y="128" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">First Muslim woman ruler</text>
    <text x="10" y="148" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a63b49">Balban (1266–87)</text>
    <text x="10" y="162" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">Blood &amp; Iron; Sijda, Paibos</text>
    <text x="10" y="176" font-family="system-ui, sans-serif" font-size="8.5" fill="#137d72">Navroz festival</text>

    <!-- 2. Khilji -->
    <rect x="178" y="0" width="165" height="190" rx="8" fill="#ffffff"/>
    <rect x="178" y="0" width="165" height="28" rx="8" fill="#137d72"/>
    <text x="260" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">KHILJI (1290–1320)</text>
    <text x="188" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Jalaluddin Khilji (1290)</text>
    <text x="188" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">Founder; tolerant policy</text>
    <text x="188" y="80" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#a63b49">Alauddin Khilji (1296–1316)</text>
    <text x="188" y="96" font-family="system-ui, sans-serif" font-size="8.5" fill="#1c2e40">• Market Control Regulations</text>
    <text x="188" y="110" font-family="system-ui, sans-serif" font-size="8.5" fill="#1c2e40">• Diwan-i-Riyasat &amp; Shahna</text>
    <text x="188" y="124" font-family="system-ui, sans-serif" font-size="8.5" fill="#1c2e40">• Dagh &amp; Chehra (Huliya)</text>
    <text x="188" y="138" font-family="system-ui, sans-serif" font-size="8.5" fill="#1c2e40">• Measurement of land (Biswa)</text>
    <text x="188" y="152" font-family="system-ui, sans-serif" font-size="8.5" fill="#1c2e40">• Malik Kafur Deccan campaigns</text>
    <text x="188" y="172" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#137d72">Alai Darwaza builder</text>

    <!-- 3. Tughlaq -->
    <rect x="356" y="0" width="165" height="190" rx="8" fill="#ffffff"/>
    <rect x="356" y="0" width="165" height="28" rx="8" fill="#142c46"/>
    <text x="438" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">TUGHLAQ (1320–1414)</text>
    <text x="366" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Ghiyasuddin Tughlaq</text>
    <text x="366" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">Founder; Tughlaqabad</text>
    <text x="366" y="78" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#137d72">Muhammad bin Tughlaq</text>
    <text x="366" y="92" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Capital shift to Daulatabad</text>
    <text x="366" y="106" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Token currency (Bronze/Copper)</text>
    <text x="366" y="120" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Diwan-i-Kohi (Agriculture)</text>
    <text x="366" y="138" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Firoz Shah Tughlaq</text>
    <text x="366" y="152" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Canal network, Jaunpur city (UP)</text>
    <text x="366" y="166" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Diwan-i-Khairat &amp; Bandagan</text>
    <text x="366" y="180" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#a63b49">1398: Timur invades Delhi</text>

    <!-- 4. Sayyid -->
    <rect x="534" y="0" width="165" height="190" rx="8" fill="#ffffff"/>
    <rect x="534" y="0" width="165" height="28" rx="8" fill="#137d72"/>
    <text x="616" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#fff">SAYYID (1414–51)</text>
    <text x="544" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Khizr Khan (1414–21)</text>
    <text x="544" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Appointed by Timur</text>
    <text x="544" y="74" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Title: Rayat-i-Ala</text>
    <text x="544" y="96" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Mubarak Shah (1421–34)</text>
    <text x="544" y="110" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Patron of Yahya bin Ahmad</text>
    <text x="544" y="124" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Tarikh-i-Mubarak Shahi</text>
    <text x="544" y="146" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Alam Shah (1445–51)</text>
    <text x="544" y="160" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Retired voluntarily to Badaun (UP)</text>
    <text x="544" y="176" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#137d72">Shortest lasting dynasty</text>

    <!-- 5. Lodi -->
    <rect x="712" y="0" width="165" height="190" rx="8" fill="#ffffff"/>
    <rect x="712" y="0" width="165" height="28" rx="8" fill="#142c46"/>
    <text x="794" y="19" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="bold" fill="#dfbf80">LODI (1451–1526)</text>
    <text x="722" y="46" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#142c46">Bahlul Lodi (1451–89)</text>
    <text x="722" y="60" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• First Afghan dynasty</text>
    <text x="722" y="74" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Bahluli copper coin</text>
    <text x="722" y="96" font-family="system-ui, sans-serif" font-size="9.5" font-weight="bold" fill="#137d72">Sikandar Lodi (1489–1517)</text>
    <text x="722" y="110" font-family="system-ui, sans-serif" font-size="8.5" fill="#142c46">• Founded Agra in 1504 (UP)</text>
    <text x="722" y="124" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Gaz-i-Sikandari (32 digits)</text>
    <text x="722" y="138" font-family="system-ui, sans-serif" font-size="8.5" fill="#607387">• Pen name: Gulrukhi</text>
    <text x="722" y="156" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#a63b49">Ibrahim Lodi (1517–26)</text>
    <text x="722" y="170" font-family="system-ui, sans-serif" font-size="8.5" fill="#a63b49">• Defeated by Babur in</text>
    <text x="722" y="184" font-family="system-ui, sans-serif" font-size="8.5" font-weight="bold" fill="#a63b49">1st Battle of Panipat (1526)</text>
  </g>

  <!-- Bottom Admin Highlights -->
  <g transform="translate(20, 290)">
    <rect x="0" y="0" width="880" height="60" rx="8" fill="#102847" stroke="#dfbf80" stroke-width="1"/>
    <text x="15" y="22" font-family="Georgia, serif" font-size="11.5" font-weight="bold" fill="#dfbf80">CENTRAL SULTANATE MINISTRIES (HIGH-YIELD UP PCS-J):</text>
    <text x="15" y="44" font-family="system-ui, sans-serif" font-size="9.5" fill="#ffffff">Diwan-i-Wizarat (Finance/Wazir) • Diwan-i-Arz (Military/Ariz-i-Mumalik, Balban) • Diwan-i-Insha (Royal Correspondence) • Diwan-i-Risalat (Foreign &amp; Religious Affairs)</text>
  </g>
</svg>
