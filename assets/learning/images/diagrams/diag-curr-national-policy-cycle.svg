<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <rect width="800" height="480" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="760" height="440" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" rx="6"/>
  <text x="400" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#142c46">National Public Policy Formulation & Governance Cycle</text>
  <text x="400" y="78" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#607387">Institutional Architecture: Union Cabinet, Line Ministries, NITI Aayog & Parliamentary Scrutiny</text>
  
  <!-- Step 1: Agenda Setting -->
  <rect x="60" y="110" width="180" height="100" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <circle cx="150" cy="110" r="14" fill="#137d72"/>
  <text x="150" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">1</text>
  <text x="150" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Agenda Setting & Need</text>
  <text x="150" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Socio-Economic Triggers</text>
  <text x="150" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Judicial Directives & CAG</text>

  <!-- Arrow 1 to 2 -->
  <path d="M 240 160 L 310 160" stroke="#137d72" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2: Policy Drafting -->
  <rect x="310" y="110" width="180" height="100" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <circle cx="400" cy="110" r="14" fill="#137d72"/>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">2</text>
  <text x="400" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Drafting & Consultation</text>
  <text x="400" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">NITI Aayog, Ministries</text>
  <text x="400" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Inter-Ministerial & Public Inputs</text>

  <!-- Arrow 2 to 3 -->
  <path d="M 490 160 L 560 160" stroke="#137d72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Executive Approval -->
  <rect x="560" y="110" width="180" height="100" rx="6" fill="#edf7f4" stroke="#137d72" stroke-width="1.5"/>
  <circle cx="650" cy="110" r="14" fill="#137d72"/>
  <text x="650" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">3</text>
  <text x="650" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Cabinet Sanction</text>
  <text x="650" y="165" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Union Cabinet / CCEA</text>
  <text x="650" y="180" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Expenditure Finance (EFC)</text>

  <!-- Downward Arrow to Step 4 -->
  <path d="M 650 210 L 650 260" stroke="#137d72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Legislative Enactment -->
  <rect x="560" y="260" width="180" height="100" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <circle cx="650" cy="260" r="14" fill="#dfbf80"/>
  <text x="650" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#142c46">4</text>
  <text x="650" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Legislative Scrutiny</text>
  <text x="650" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">Parliamentary Standing Comm.</text>
  <text x="650" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Lok Sabha &amp; Rajya Sabha</text>

  <!-- Arrow 4 to 5 (Leftward) -->
  <path d="M 560 310 L 490 310" stroke="#137d72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: Implementation -->
  <rect x="310" y="260" width="180" height="100" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <circle cx="400" cy="260" r="14" fill="#dfbf80"/>
  <text x="400" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#142c46">5</text>
  <text x="400" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Public Delivery</text>
  <text x="400" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">State Administration &amp; DBTs</text>
  <text x="400" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">District Collectors &amp; PRIs</text>

  <!-- Arrow 5 to 6 (Leftward) -->
  <path d="M 310 310 L 240 310" stroke="#137d72" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: Evaluation & Audit -->
  <rect x="60" y="260" width="180" height="100" rx="6" fill="#fdf8f0" stroke="#dfbf80" stroke-width="1.5"/>
  <circle cx="150" cy="260" r="14" fill="#dfbf80"/>
  <text x="150" y="265" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#142c46">6</text>
  <text x="150" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#142c46">Social Audit &amp; Review</text>
  <text x="150" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10.5" fill="#4a5568">CAG Performance Audits</text>
  <text x="150" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#607387">Feedback Loop to Planning</text>

  <!-- Upward Loop back to 1 -->
  <path d="M 150 260 L 150 210" stroke="#137d72" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <rect x="60" y="390" width="680" height="50" rx="4" fill="#142c46"/>
  <text x="400" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11.5" fill="#dfbf80">Judicial Review &amp; Constitutional Prerogative: Supreme Court / High Courts verify vires under Articles 32 &amp; 226</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#137d72"/>
    </marker>
  </defs>
</svg>